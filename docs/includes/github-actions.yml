# docs/guides/github-actions.md includes the sections of this example;
# tests/architecture/ci_test.go (TestGitHubActionExampleMatchesTheAction and
# TestGitHubPublishExampleMatchesTheAction) checks it against
# integrations/github/run/action.yml and integrations/github/publish/action.yml.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  # --8<-- [start:run]
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@<sha> # pin by commit SHA
        with:
          persist-credentials: false
      - uses: TrianaLab/aval/integrations/github/run@<sha> # pin by commit SHA
        with:
          test: unit
  # --8<-- [end:run]
  # --8<-- [start:lookup]
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@<sha> # pin by commit SHA
        with:
          persist-credentials: false
      - id: lookup
        uses: TrianaLab/aval/integrations/github/run@<sha> # pin by commit SHA
        with:
          test: ui
          lookup-only: "true"
      - uses: actions/setup-node@<sha> # pin by commit SHA; probed, so never skipped
      - if: steps.lookup.outputs.outcome != 'verified'
        run: npm ci && npx --no playwright install --with-deps
      - uses: TrianaLab/aval/integrations/github/run@<sha> # pin by commit SHA
        with:
          test: ui
  # --8<-- [end:lookup]
  # --8<-- [start:publish]
  publish:
    needs: [unit, ui]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@<sha> # pin by commit SHA
        with:
          persist-credentials: false
      - uses: TrianaLab/aval/integrations/github/publish@<sha> # pin by commit SHA
  # --8<-- [end:publish]
