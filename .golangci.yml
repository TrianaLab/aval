version: "2"
linters:
  enable:
    - gocyclo
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*os.File).Close
    gocyclo:
      # Reports functions above this complexity (tests/architecture keeps it <= 15).
      min-complexity: 15
