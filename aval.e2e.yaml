# Aval dogfooding: the heavy suite, levels 2 (tests/integration: in-process
# registry) and 4 (tests/acceptance: run, push and verify through the CLI,
# with signing). `make ci-e2e` runs it through `aval run`; in CI a verified
# result for the same inputs is reused (#28). The scope is every file the
# suite builds or reads, including the Makefile targets runner.command calls.
apiVersion: aval.trianalab.io/v1
kind: Test
metadata:
  name: aval-e2e
runner:
  command: ["make", "test-integration", "test-acceptance"]
scope:
  source:
    - "cmd/**"
    - "internal/**"
    - "pkg/**"
    - "tests/integration/**"
    - "tests/acceptance/**"
    - "examples/go-compose/**"
    # Top-level files and packages/ only: a local uv run leaves a .venv with
    # symlinks at the example's root.
    - "examples/uv-monorepo/*"
    - "examples/uv-monorepo/packages/**"
    # tests/acceptance runs the docs quickstart as written.
    - "docs/quickstart.md"
    # tests/acceptance runs the history estimate script.
    - "scripts/estimate-reuse.sh"
    # tests/acceptance runs the GitHub action's scripts (#211).
    - "integrations/github/**"
    # tests/acceptance runs the example's suites through aval (#217), one
    # with the runner image's npm.
    - "examples/github-monorepo/**"
  # Redundant since #63 (Aval never hashes .aval/), kept so the canonical
  # contract, and with it the published results, stay the same.
  exclude: ["**/.aval/**"]
  dependencies: [go.mod, go.sum, Makefile]
  # The example's fixtures name this tag on purpose (#217); the suite only
  # reads them, nothing pulls the image. One entry per file: the pinned
  # release predates allowMutable[].files.
  allowMutable:
    - file: examples/github-monorepo/data/fixtures/podinfo.yaml
      ref: ghcr.io/stefanprodan/podinfo:6.5.0
      reason: example fixture, read as text by tests/acceptance
    - file: examples/github-monorepo/data/fixtures/podinfo-canary.yaml
      ref: ghcr.io/stefanprodan/podinfo:6.5.0
      reason: example fixture, read as text by tests/acceptance
environment:
  toolchain: {go: "1.27", uv: "0.9.18"}
  env: [GOFLAGS, GOEXPERIMENT, CGO_ENABLED]
cacheability: hermetic
