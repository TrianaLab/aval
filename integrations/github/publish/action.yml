# Signs and pushes the aval-<test> artifacts that the aval run action
# uploaded in this workflow run (#212), one step in the consumer's own
# publish job. A composite action, not a reusable workflow: steps of a
# composite action run in the caller's job, so the Fulcio certificate names
# the calling workflow. A reusable workflow would put Aval's workflow in every
# caller's certificate, and one subjectRegexp would trust them all.
# GitHub specifics live here, outside core (AGENTS.md invariant 8).
# docs/guides/github-actions.md documents it; tests/acceptance/github_publish_test.go
# runs guard.sh and publish.sh.
name: aval publish
description: Sign and push this run's aval-* artifacts with the calling workflow's identity, to the registry in the default branch's trust policy.
inputs:
  file:
    description: The contract file.
    default: aval.yaml
  policy:
    description: Path of the trust policy in the default branch; its registry field names where to push.
    default: .github/aval/policy.yaml
  registry-username:
    description: Registry user name.
    default: ${{ github.actor }}
  registry-password:
    description: Registry password or token.
    default: ${{ github.token }}
  stats:
    description: Also publish every artifact's run record (aval stats publish), hit or miss, best effort.
    default: "false"
  stats-registry:
    description: >-
      Registry (host/path) for the run records; empty means the policy's registry.
      Gets the registry credentials only when on the policy registry's host.
    default: ""
  allow-unprotected:
    description: Publish from a ref other than the default branch.
    default: "false"
runs:
  using: composite
  steps:
    - name: Refuse refs and events that must not sign
      shell: bash
      env:
        ALLOW_UNPROTECTED: ${{ inputs.allow-unprotected }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: /bin/bash "$GITHUB_ACTION_PATH/guard.sh"
    # Outside the checkout, so an artifact cannot overwrite a file push reads.
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: aval-*
        path: ${{ runner.temp }}/aval-artifacts
    # Every later step runs only when there is something to publish (#260).
    - name: Find this run's aval-* artifacts
      id: found
      shell: bash
      env:
        ARTIFACTS: ${{ runner.temp }}/aval-artifacts
      run: /bin/bash "$GITHUB_ACTION_PATH/found.sh"
    # cosign only verifies the aval release below. Installed off the job's
    # PATH (no GITHUB_PATH, no GITHUB_ENV), so the test and later steps keep
    # their own cosign or none (#248). To move the pin, copy the four lines of
    # the new release's cosign_checksums.txt into both actions; tests/release
    # (TestCosignPinMatchesRelease) checks them.
    - name: Install the pinned cosign (verified, off PATH)
      id: cosign
      if: steps.found.outputs.any == 'true'
      shell: bash
      env:
        COSIGN_VERSION: v3.0.6
        COSIGN_SHA256: >-
          cosign-linux-amd64=c956e5dfcac53d52bcf058360d579472f0c1d2d9b69f55209e256fe7783f4c74
          cosign-linux-arm64=bedac92e8c3729864e13d4a17048007cfafa79d5deca993a43a90ffe018ef2b8
          cosign-darwin-amd64=4c3e7af8372d3ca3296e62fa56f23fcbb5721cc6ac1827900d398f110d7cd280
          cosign-darwin-arm64=5fadd012ae6381a6a29ff86a7d39aa873878852f1073fc90b15995961ecfb084
        COSIGN_BASE_URL: https://github.com/sigstore/cosign/releases/download
      run: /bin/bash "$GITHUB_ACTION_PATH/../get-cosign.sh"
    # The same pinned release as integrations/github/run (tests/architecture
    # keeps the two install steps identical).
    # The pin-actions job of release.yaml moves DESIRED_VERSION and AVAL_SHA256
    # to each new release (#213); tests/release checks them against its checksums.txt.
    - name: Install the pinned aval release (verified)
      id: install
      if: steps.found.outputs.any == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        DESIRED_VERSION: v0.11.0
        AVAL_SHA256: >-
          linux_amd64=dcf7d242c634d943f392dc00d9bc735c2c4faf6d8fd0852633046a6c574faa0f
          linux_arm64=86925c7f80dd82359cbd9c1176d086aca7219205111e15476699286f814298ed
          darwin_amd64=eec676c8f5d58d9288bf596539ea79e920c7d5150ee28f179a8fc30c185f1e10
          darwin_arm64=e612d5da2372d10712a1ba8f94a530c0bbace0543a7a07894e7493b589dcbb41
        AVAL_REQUIRE_VERIFY: "1"
        AVAL_REQUIRE_PROVENANCE: "1"
        AVAL_NO_VERIFY: ""
        AVAL_DOWNLOAD_URL: ""
        USE_SUDO: "false"
        COSIGN_DIR: ${{ steps.cosign.outputs.dir }}
      run: |
        dir="$RUNNER_TEMP/aval-$DESIRED_VERSION"
        # PATH is cut to the private cosign first, then the system tools and
        # gh, so neither an earlier step that wrote GITHUB_PATH nor a cosign
        # beside gh can shim them. An empty COSIGN_DIR would put the working
        # directory on PATH: refuse it.
        [ -x "$COSIGN_DIR/cosign" ] && [[ "$COSIGN_DIR" == /* ]] || { echo "no private cosign in '$COSIGN_DIR'" >&2; exit 1; }
        gh=$(command -v gh)
        PATH="$COSIGN_DIR:/usr/bin:/bin:${gh%/*}" AVAL_INSTALL_DIR="$dir" \
          /bin/bash "$GITHUB_ACTION_PATH/../../../scripts/get-aval.sh" --version "$DESIRED_VERSION"
        echo "aval=$dir/aval" >> "$GITHUB_OUTPUT"
    - name: aval push
      if: steps.found.outputs.any == 'true'
      shell: bash
      env:
        AVAL: ${{ steps.install.outputs.aval }}
        ARTIFACTS: ${{ runner.temp }}/aval-artifacts
        INPUT_FILE: ${{ inputs.file }}
        INPUT_POLICY: ${{ inputs.policy }}
        INPUT_STATS: ${{ inputs.stats }}
        INPUT_STATS_REGISTRY: ${{ inputs.stats-registry }}
        REGISTRY_USERNAME: ${{ inputs.registry-username }}
        REGISTRY_PASSWORD: ${{ inputs.registry-password }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        GH_TOKEN: ${{ github.token }}
      run: /bin/bash "$GITHUB_ACTION_PATH/publish.sh"
