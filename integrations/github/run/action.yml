# Runs one or several tests (#327) through Aval in a GitHub Actions job (#211). The trust
# policy, and the registry inside it, come from the default branch, never
# from the checkout; a job that could sign (id-token: write) is refused.
# GitHub specifics live here, outside core (AGENTS.md invariant 8).
# docs/guides/github-actions.md documents it; tests/acceptance/github_run_test.go
# runs guard.sh and run.sh.
name: aval run
description: Reuse a verified test result or run the test, with the trust policy from the default branch.
inputs:
  test:
    description: >-
      The test to run, by metadata.name (aval run --test), or several: names and
      glob patterns (go.*) separated by spaces, commas or newlines. They run one
      after the other; the step fails if any fails, after running them all.
    required: true
  file:
    description: The contract file.
    default: aval.yaml
  policy:
    description: Path of the trust policy in the default branch.
    default: .github/aval/policy.yaml
  shadow:
    description: Run the test even when a verified result exists, and fail on a false hit (aval run --shadow).
    default: "false"
  lookup-only:
    description: >-
      Only look up and verify a result (aval verify), never run the test, upload
      or write .aval/: outcome verified or miss lets later setup steps be skipped.
      A miss succeeds the step, exit 5 fails it. Keep a normal run step after it;
      it decides reuse. Cannot be combined with shadow.
    default: "false"
  min-trust-level:
    description: >-
      Raise the policy's minTrustLevel for this run: auto (runner when the ref is
      the default branch, on any event; otherwise no raise), developer, runner or
      isolated. It never lowers the policy's minimum; developer opts out of the
      default-branch raise.
    default: auto
  registry-username:
    description: User for reading the policy's registry, sent to its host only. Empty reads anonymously. Kept out of the test's environment.
    default: ""
  registry-password:
    description: Read-only token for the policy's registry (github.token with the job's permissions set to packages read), sent to its host only. Empty reads anonymously. Kept out of the test's environment, but code in the same job can still reach it; never pass a write credential.
    default: ""
outputs:
  outcome:
    description: >-
      verified, miss, verification-failed or error, from the report. With several
      tests, the worst of them: verified only when every test is.
    value: ${{ steps.run.outputs.outcome }}
  outcomes:
    description: A JSON object of each test's outcome, by test name.
    value: ${{ steps.run.outputs.outcomes }}
runs:
  using: composite
  steps:
    - name: Refuse unsafe events and signing credentials
      shell: bash
      run: /bin/bash "$GITHUB_ACTION_PATH/guard.sh"
    # cosign only verifies the aval release below. Installed off the job's
    # PATH (no GITHUB_PATH, no GITHUB_ENV), so the test and later steps keep
    # their own cosign or none (#248). To move the pin, copy the four lines of
    # the new release's cosign_checksums.txt into both actions; tests/release
    # (TestCosignPinMatchesRelease) checks them.
    - name: Install the pinned cosign (verified, off PATH)
      id: cosign
      shell: bash
      env:
        COSIGN_VERSION: v3.0.6
        COSIGN_SHA256: >-
          cosign-linux-amd64=c956e5dfcac53d52bcf058360d579472f0c1d2d9b69f55209e256fe7783f4c74
          cosign-linux-arm64=bedac92e8c3729864e13d4a17048007cfafa79d5deca993a43a90ffe018ef2b8
          cosign-darwin-amd64=4c3e7af8372d3ca3296e62fa56f23fcbb5721cc6ac1827900d398f110d7cd280
          cosign-darwin-arm64=5fadd012ae6381a6a29ff86a7d39aa873878852f1073fc90b15995961ecfb084
        COSIGN_BASE_URL: https://github.com/sigstore/cosign/releases/download
      run: /bin/bash "$GITHUB_ACTION_PATH/../get-cosign.sh"
    # The pinned release, checked against its per-platform sha256 and the
    # release workflow's signature and provenance by this commit's
    # scripts/get-aval.sh (#202).
    # The pin-actions job of release.yaml moves DESIRED_VERSION and AVAL_SHA256
    # to each new release (#213); tests/release checks them against its checksums.txt.
    - name: Install the pinned aval release (verified)
      id: install
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        DESIRED_VERSION: v0.12.1
        AVAL_SHA256: >-
          linux_amd64=a5de2768ff0aa8fdcf4488a68b491232186eea74216700e242f486d7d3cb7232
          linux_arm64=b799730a7d8d13f0c99a9aecec4365095b2f2379e93859d5860e6816dd129690
          darwin_amd64=42c2024732ee182e825c6e495d0a8161fdbd07bd894e00570c2a17bc95e1cad8
          darwin_arm64=2feb54871f39e8f99e53dd2b47bc066514d15748d22c24b8d78159b53366b2b4
        AVAL_REQUIRE_VERIFY: "1"
        AVAL_REQUIRE_PROVENANCE: "1"
        AVAL_NO_VERIFY: ""
        AVAL_DOWNLOAD_URL: ""
        USE_SUDO: "false"
        COSIGN_DIR: ${{ steps.cosign.outputs.dir }}
      run: |
        dir="$RUNNER_TEMP/aval-$DESIRED_VERSION"
        # PATH is cut to the private cosign first, then the system tools and
        # gh, so neither an earlier step that wrote GITHUB_PATH nor a cosign
        # beside gh can shim them. An empty COSIGN_DIR would put the working
        # directory on PATH: refuse it.
        [ -x "$COSIGN_DIR/cosign" ] && [[ "$COSIGN_DIR" == /* ]] || { echo "no private cosign in '$COSIGN_DIR'" >&2; exit 1; }
        gh=$(command -v gh)
        PATH="$COSIGN_DIR:/usr/bin:/bin:${gh%/*}" AVAL_INSTALL_DIR="$dir" \
          /bin/bash "$GITHUB_ACTION_PATH/../../../scripts/get-aval.sh" --version "$DESIRED_VERSION"
        echo "aval=$dir/aval" >> "$GITHUB_OUTPUT"
    - name: aval run
      id: run
      shell: bash
      env:
        AVAL: ${{ steps.install.outputs.aval }}
        INPUT_TEST: ${{ inputs.test }}
        INPUT_FILE: ${{ inputs.file }}
        INPUT_POLICY: ${{ inputs.policy }}
        INPUT_SHADOW: ${{ inputs.shadow }}
        INPUT_LOOKUP_ONLY: ${{ inputs.lookup-only }}
        INPUT_MIN_TRUST_LEVEL: ${{ inputs.min-trust-level }}
        REGISTRY_USERNAME: ${{ inputs.registry-username }}
        REGISTRY_PASSWORD: ${{ inputs.registry-password }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        GH_TOKEN: ${{ github.token }}
      run: /bin/bash "$GITHUB_ACTION_PATH/run.sh"
    - if: ${{ !cancelled() && steps.run.outputs.upload == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        # aval-<test> for one test; aval-.<id> holding <test>/ for several.
        name: ${{ steps.run.outputs.artifact }}
        path: ${{ steps.run.outputs.artifact-path }}
        include-hidden-files: true
        if-no-files-found: ignore
        # A re-run replaces the earlier attempt's artifact (#249).
        overwrite: true
