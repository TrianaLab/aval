# Runs one test through Aval in a GitHub Actions job (#211). The trust
# policy, and the registry inside it, come from the default branch, never
# from the checkout; a job that could sign (id-token: write) is refused.
# GitHub specifics live here, outside core (AGENTS.md invariant 8).
# docs/guides/github-actions.md documents it; tests/acceptance/github_run_test.go
# runs guard.sh and run.sh.
name: aval run
description: Reuse a verified test result or run the test, with the trust policy from the default branch.
inputs:
  test:
    description: The test to run, by metadata.name (aval run --test).
    required: true
  file:
    description: The contract file.
    default: aval.yaml
  policy:
    description: Path of the trust policy in the default branch.
    default: .github/aval/policy.yaml
  shadow:
    description: Run the test even when a verified result exists, and fail on a false hit (aval run --shadow).
    default: "false"
outputs:
  outcome:
    description: verified, miss, verification-failed or error, from the report.
    value: ${{ steps.run.outputs.outcome }}
runs:
  using: composite
  steps:
    - name: Refuse unsafe events and signing credentials
      shell: bash
      run: /bin/bash "$GITHUB_ACTION_PATH/guard.sh"
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: v3.0.6
    # The pinned release, checked against its per-platform sha256 and the
    # release workflow's signature and provenance by this commit's
    # scripts/get-aval.sh (#202).
    # The pin-actions job of release.yaml moves DESIRED_VERSION and AVAL_SHA256
    # to each new release (#213); tests/release checks them against its checksums.txt.
    # TODO(milestone-14): drop this line once a pin PR moves to the first release with --test, --outputs-dir and the policy's registry.
    - name: Install the pinned aval release (verified)
      id: install
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        DESIRED_VERSION: v0.8.2
        AVAL_SHA256: >-
          linux_amd64=e72f2cd93dbc1502d033403ef7ba65274c79331f07b77115f6c470e45ac92faf
          linux_arm64=96af65140fbb07ac42a378880ffc8825db0614d80575e55fa9d125b8e9f5f782
          darwin_amd64=2de3493bf80260827025f6b67b2c092008047b01311035f6dac3d190467a2e4e
          darwin_arm64=68ad4b36c131b4f3955cf6871730970cf2582222cdb0d77e2266c415f1907624
        AVAL_REQUIRE_VERIFY: "1"
        AVAL_REQUIRE_PROVENANCE: "1"
        AVAL_NO_VERIFY: ""
        AVAL_DOWNLOAD_URL: ""
        USE_SUDO: "false"
      run: |
        dir="$RUNNER_TEMP/aval-$DESIRED_VERSION"
        # PATH is cut to the system tools, cosign and gh, so an earlier step
        # that wrote GITHUB_PATH cannot shim them.
        cosign=$(command -v cosign)
        gh=$(command -v gh)
        PATH="/usr/bin:/bin:${cosign%/*}:${gh%/*}" AVAL_INSTALL_DIR="$dir" \
          /bin/bash "$GITHUB_ACTION_PATH/../../../scripts/get-aval.sh" --version "$DESIRED_VERSION"
        echo "aval=$dir/aval" >> "$GITHUB_OUTPUT"
    - name: aval run
      id: run
      shell: bash
      env:
        AVAL: ${{ steps.install.outputs.aval }}
        INPUT_TEST: ${{ inputs.test }}
        INPUT_FILE: ${{ inputs.file }}
        INPUT_POLICY: ${{ inputs.policy }}
        INPUT_SHADOW: ${{ inputs.shadow }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        GH_TOKEN: ${{ github.token }}
      run: /bin/bash "$GITHUB_ACTION_PATH/run.sh"
    - if: ${{ !cancelled() && steps.run.outputs.upload == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: aval-${{ inputs.test }}
        path: .aval/${{ inputs.test }}/
        include-hidden-files: true
        if-no-files-found: ignore
