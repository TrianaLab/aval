# The example's CI. Integrating Aval changed this file in two places: each
# suite job runs its test through the aval run action instead of make, and
# the publish job signs the results on main. test-external stays a plain
# make job. docs/guides/integrate-in-5-files.md walks through it.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # --8<-- [start:run]
      - uses: TrianaLab/aval/integrations/github/run@d4a98a630f94215b8608ff57318b0bd386382274 # v0.9.0
        with:
          test: unit
      # --8<-- [end:run]
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: TrianaLab/aval/integrations/github/run@d4a98a630f94215b8608ff57318b0bd386382274 # v0.9.0
        with:
          test: ui
  e2e:
    strategy:
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # --8<-- [start:matrix]
      - uses: TrianaLab/aval/integrations/github/run@d4a98a630f94215b8608ff57318b0bd386382274 # v0.9.0
        with:
          test: e2e-${{ matrix.shard }}
      # --8<-- [end:matrix]
  external:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make test-external
  # --8<-- [start:publish]
  publish:
    needs: [unit, ui, e2e]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: TrianaLab/aval/integrations/github/publish@d4a98a630f94215b8608ff57318b0bd386382274 # v0.9.0
  # --8<-- [end:publish]
