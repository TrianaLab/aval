# Pinned by digest: a tag such as redis:7.4-alpine can be repushed without
# changing this file, so the fingerprint would not see the change. Aval
# refuses to reuse a controlled-environment result with an unpinned image
# (see "Pin your dependencies" in the docs). To update, resolve the tag's
# current digest, e.g. docker buildx imagetools inspect redis:7.4-alpine.
services:
  redis:
    image: redis:7.4-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      retries: 30
