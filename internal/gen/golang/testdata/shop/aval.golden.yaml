apiVersion: aval.trianalab.io/v1
kind: TestSet
defaults:
  scope:
    dependencies: [go.mod]
  cacheability: hermetic
tests:
  # hand-written, kept as is
  - metadata: {name: e2e}
    use: [go.web]
    runner: {command: [go, run, .]}
  - metadata: {name: go.internal.money}
    runner: {command: [go, test, ./internal/money]}
    use:
      - go.internal.money
      - go.module
  - metadata: {name: go.internal.orders}
    runner: {command: [go, test, ./internal/orders]}
    use:
      - go.internal.money
      - go.internal.orders
      - go.internal.orders.test
      - go.internal.testutil
      - go.module
  - metadata: {name: go.internal.testutil}
    runner: {command: [go, test, ./internal/testutil]}
    use:
      - go.internal.testutil
      - go.module
  - metadata: {name: go.shop}
    runner: {command: [go, test, .]}
    use:
      - go.internal.money
      - go.internal.orders
      - go.internal.testutil
      - go.module
      - go.shop
  - metadata: {name: go.web}
    runner: {command: [go, test, ./web]}
    use:
      - go.internal.money
      - go.module
      - go.web
      - go.web.test
fragments:
  go.internal.money:
    scope:
      source:
        - internal/money/*.go
  go.internal.orders:
    scope:
      source:
        - fixtures/rates.json
        - internal/orders/*.go
        - internal/orders/testdata/**
  go.internal.orders.test:
    scope:
      source:
        - fixtures/order.json
  go.internal.testutil:
    scope:
      source:
        - internal/testutil/*.go
  go.module:
    scope:
      dependencies:
        - go.mod
    environment:
      toolchain: {go: "1.22"}
      probe:
        go: [go, env, GOVERSION]
      env:
        - CGO_ENABLED
        - GOARCH
        - GODEBUG
        - GOEXPERIMENT
        - GOFLAGS
        - GOOS
        - GOTOOLCHAIN
        - GOWORK
  go.shop:
    scope:
      source:
        - '*.go'
  go.web:
    scope:
      source:
        - web/**
        - web/*.go
        - web/static/index.html
  go.web.test:
    scope:
      source:
        - fixtures/pages/**
