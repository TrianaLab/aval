apiVersion: aval.trianalab.io/v1
kind: TestSet
# Shared inputs aval gen java does not list: the version catalog.
defaults:
  scope:
    dependencies: [gradle/libs.versions.toml]
    exclude: ["**/build/**", "**/.gradle/**"]
  cacheability: hermetic
fragments:
  java.common:
    scope:
      source:
        - build.gradle.kts
        - common/**
        - settings.gradle.kts
  java.inventory:
    scope:
      source:
        - build.gradle.kts
        - inventory/**
        - settings.gradle.kts
  java.services.api:
    scope:
      source:
        - build.gradle.kts
        - services/api/**
        - services/build.gradle.kts
        - settings.gradle.kts
  java.services.web:
    scope:
      source:
        - build.gradle.kts
        - services/build.gradle.kts
        - services/web/**
        - settings.gradle.kts
tests:
  - metadata: {name: java.common}
    runner: {command: [./gradlew, ':common:test']}
    use:
      - java.common
  - metadata: {name: java.inventory}
    runner: {command: [./gradlew, ':inventory:test']}
    use:
      - java.common
      - java.inventory
  - metadata: {name: java.services.api}
    runner: {command: [./gradlew, ':services:api:test']}
    use:
      - java.common
      - java.inventory
      - java.services.api
  - metadata: {name: java.services.web}
    runner: {command: [./gradlew, ':services:web:test']}
    use:
      - java.common
      - java.inventory
      - java.services.api
      - java.services.web
