# minimal.yaml with every optional field present but empty. Its manifest
# must equal the one of minimal.yaml.
apiVersion: aval.trianalab.io/v1
kind: Test
metadata:
  name: golden-minimal
runner:
  command: [./run.sh]
scope:
  source: [main.go]
  exclude: []
  dependencies: []
environment:
  toolchain: {}
  env: []
cacheability: hermetic
