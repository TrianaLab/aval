# Fixed contract for TestManifestGolden. Any edit to this tree changes the
# golden manifest: make one only together with a fingerprint.Version bump.
# Lists are unsorted and repeated so the golden pins canonical sort and dedup;
# the last argv entry pins argv order and JSON escaping (&, <, >, non-ASCII).
# The test sets DB_IMAGE, sets EMPTY to "" and leaves MODE unset. pkg/.git is
# a regular file the test creates (a worktree gitfile): it is an input, unlike
# a .git directory. crlf.txt pins raw content bytes (no EOL normalization).
apiVersion: aval.trianalab.io/v1
kind: Test
metadata:
  name: golden
runner:
  command: ["./run.sh", "-v", "a && b <c> é"]
scope:
  source: ["run.sh", "hook.sh", "owner.sh", "other.sh", "suid.txt", "crlf.txt", "contract.yaml", "**/*.go", ".hidden/*", "pkg/.git", "run.sh"]
  exclude: ["vendor/**", "notes.txt", "vendor/**"]
  dependencies: [go.sum, deps.lock, go.sum]
environment:
  toolchain: {go: "1.25", docker: "27", node: "22", python: "3.13", rust: "1.90", zig: "0.15"}
  env: [MODE, DB_IMAGE, MODE, EMPTY]
cacheability: hermetic
