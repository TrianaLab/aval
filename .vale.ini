# Prose gate (`make docs-lint`). Vale owns prose, markdownlint owns Markdown
# syntax, tests/architecture/docs_test.go owns links. AGENTS.md "Style":
# concise and concrete, no marketing words, no filler.
StylesPath = .vale/styles
MinAlertLevel = error

[*.md]
BasedOnStyles = Aval

# A doubled word ("the the").
Vale.Repetition = error
