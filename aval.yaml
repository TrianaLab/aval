# Aval dogfooding: the engine unit suite. tests/architecture is deliberately
# out of scope (it reads .agents/ and .claude/, which hold symlinks) and
# always runs. The scope is every file the suite reads (invariant 2):
# testdata, the CLI reference cmd/aval checks, and the contracts the contract
# fuzz target seeds from. tests/architecture/dogfood_test.go fails if a suite
# reads a repository file outside its contract's scope.
apiVersion: aval.trianalab.io/v1
kind: Test
metadata:
  name: aval-engine
runner:
  command: ["go", "test", "-race", "./cmd/...", "./internal/...", "./pkg/..."]
scope:
  source:
    - "cmd/**"
    - "internal/**"
    - "pkg/**"
    - "docs/cli-reference.md"
    - "aval.yaml"
    - "examples/go-compose/aval.yaml"
  # Redundant since #63 (Aval never hashes .aval/), kept so the canonical
  # contract, and with it the published results, stay the same.
  exclude: ["**/.aval/**"]
  dependencies: [go.mod, go.sum]
environment:
  toolchain: {go: "1.27"}
cacheability: hermetic
