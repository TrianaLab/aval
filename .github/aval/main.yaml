# Dogfooding trust policy for main and releases (#28): reuse only results
# signed keyless by Aval's own CI workflow on main, at runner level. No
# developer signatures. tests/architecture/dogfood_test.go enforces this.
apiVersion: aval.trianalab.io/v1
kind: Policy
minTrustLevel: runner
identities:
  - issuer: https://token.actions.githubusercontent.com
    subjectRegexp: https://github\.com/TrianaLab/aval/\.github/workflows/ci\.yaml@refs/heads/main
    trustLevel: runner
