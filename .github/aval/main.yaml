# Dogfooding trust policy for main and releases (#28): reuse only results
# signed keyless by Aval's own CI workflow on main, at runner level.
# tests/architecture/dogfood_test.go enforces this.
apiVersion: aval.trianalab.io/v1
kind: Policy
minTrustLevel: runner
identities:
  - issuer: https://token.actions.githubusercontent.com
    subjectRegexp: https://github\.com/TrianaLab/aval/\.github/workflows/ci\.yaml@refs/heads/main
    trustLevel: runner
  # Maintainers (#130), listed only so main knows them: at developer level,
  # below minTrustLevel, so a result they signed is never reused here. A
  # fingerprint with only such a result is a miss (the tests run and CI
  # publishes its own result), not a verification failure; an unlisted
  # signer still is one. Keep in sync with pr.yaml.
  - issuer: https://github.com/login/oauth
    subjectRegexp: edudiazasencio@gmail\.com
    trustLevel: developer
