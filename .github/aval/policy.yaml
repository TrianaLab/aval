# Aval's trust policy (#28, #216). The GitHub actions in ci.yaml read it from
# main through the contents API, never from the checkout, and push to its
# registry. Only ci.yaml on main signs at runner level. The run action raises
# the minimum to runner on main (min-trust-level: auto, #251) and release.yaml's
# e2e-gate does too (--min-trust-level runner), so main and releases never
# reuse a developer signature; pull requests do. An unlisted signer is a
# verification failure. tests/architecture/dogfood_test.go enforces this.
apiVersion: aval.trianalab.io/v1
kind: Policy
registry: ghcr.io/trianalab/aval-attestations
minTrustLevel: developer
identities:
  - issuer: https://token.actions.githubusercontent.com
    subjectRegexp: https://github\.com/TrianaLab/aval/\.github/workflows/ci\.yaml@refs/heads/main
    trustLevel: runner
  # Maintainers (#130), always at developer level only: a local run they
  # signed keyless after the interactive Sigstore login (CONTRIBUTING.md,
  # "Save PR CI time: sign a local run").
  - issuer: https://github.com/login/oauth
    subjectRegexp: edudiazasencio@gmail\.com
    trustLevel: developer
