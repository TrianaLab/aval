name: docs

# Publishes the MkDocs site (mkdocs.yml) to GitHub Pages. mike keeps every
# version on the gh-pages branch: a push to main deploys version `main`, a
# release tag v<version> deploys <version> with the `latest` alias and makes
# `latest` the default. The gh-pages tree is then uploaded as the Pages
# artifact, so Pages must use "GitHub Actions" as its source.
#
# Until a maintainer enables that (Settings > Pages > Source: GitHub Actions),
# the `pages` job reports a notice and `deploy` is skipped, so the workflow
# stays green. Write scopes only on push to main or a tag, never on
# pull_request; the PR-side check is `make docs-site` in ci.yaml (ci-docs).

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          build_type=$(gh api "repos/$REPO/pages" --jq .build_type 2>/dev/null || true)
          if [ "$build_type" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=docs not deployed::GitHub Pages is not enabled with source \"GitHub Actions\" (Settings > Pages); skipping the deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: pages
    if: needs.pages.outputs.enabled == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # mike pushes the gh-pages branch
      pages: write
      id-token: write # actions/deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r docs/requirements.txt
      # Same strict gate as ci-docs, so nothing that fails it is published.
      - run: make docs-site
      - name: Deploy the version with mike
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages || echo "no gh-pages branch yet; mike creates it"
          export NO_MKDOCS_2_WARNING=1
          if [ "$REF_TYPE" = "tag" ]; then
            mike deploy --push --update-aliases "${REF_NAME#v}" latest
            mike set-default --push latest
          else
            mike deploy --push main
            # Before the first release there is no `latest`; serve main.
            mike list latest > /dev/null 2>&1 || mike set-default --push main
          fi
          git worktree add "$RUNNER_TEMP/gh-pages" gh-pages
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/gh-pages
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
