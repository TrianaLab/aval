name: ci

# Each ci-* job runs the `make` leg of the same name, so `make ci` locally and
# this workflow stay one to one. The `required` job aggregates every other job
# and is the only required status check; tests/architecture/ci_test.go fails if
# a job is not wired into it.

on:
  push:
    branches: [main]
  pull_request:
    # `edited` reruns the workflow when the title changes, so pr-title sees
    # the current title. Every job reruns: skipping the others on `edited`
    # would let `required` go green over a failed run on the same commit.
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path filter: a change that touches only Markdown or docs/ cannot affect
  # the code legs, so they are skipped. ci-gates always runs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'

  ci-static:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.0
          install-only: true
      - run: make ci-static

  ci-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: make ci-gates

  ci-engine:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: make ci-engine
      # Informational: the 100% gate is enforced by `make ci-engine` above.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.gate.out
          fail_ci_if_error: false

  ci-integration:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: make ci-integration

  ci-acceptance:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: make ci-acceptance

  ci-release:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: make ci-release

  # Short fuzz run (FUZZTIME per target, see Makefile); the long run is
  # fuzz.yaml on a schedule. A crasher is uploaded so it can be committed as
  # a regression case.
  ci-fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: make ci-fuzz
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crashers
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore

  # govulncheck on PRs and main; security.yaml runs it on a schedule too,
  # since a new advisory can affect unchanged code.
  ci-security:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: make ci-security

  # Docs gates: markdownlint, vale and CLI reference drift. No path filter:
  # a docs-only PR must run it too. Links are checked in ci-gates.
  ci-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # Release binary checked against a pinned sha256; the version must equal
      # VALE_VERSION in the Makefile (`make docs-lint` refuses any other).
      - name: Install vale
        env:
          VALE_VERSION: 3.21.0
          VALE_SHA256: 96997d19a4ca6981673b0d4c5ca7f3ede4a9f97964a96edc29fba9e28a328336
        run: |
          tgz="$RUNNER_TEMP/vale.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors -o "$tgz" \
            "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          echo "$VALE_SHA256  $tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/vale" && tar -xzf "$tgz" -C "$RUNNER_TEMP/vale" vale
          echo "$RUNNER_TEMP/vale" >> "$GITHUB_PATH"
      - run: make ci-docs

  # Fails a PR that adds a dependency with a known vulnerability. GitHub only
  # (needs the PR's dependency graph diff), so it has no `make` leg.
  # Skipped until a maintainer enables Settings > Code security > Dependency
  # graph and sets the repository variable DEPENDENCY_REVIEW=true; without the
  # dependency graph the action fails on every PR.
  dependency-review:
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

  # Dogfooding M1 (#28): Aval's own contract must fingerprint identically on
  # every OS and checkout path. Any difference is a determinism bug. CI-only
  # (needs several OSes), so it has no `make` leg.
  dogfood-fingerprint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Fingerprint from two checkout paths
        run: |
          make build
          a=$(./bin/aval run --fingerprint-only)
          other="$RUNNER_TEMP/elsewhere/aval"
          mkdir -p "$(dirname "$other")" && cp -R . "$other"
          b=$(./bin/aval run --fingerprint-only -f "$other/aval.yaml")
          test "$a" = "$b" || { echo "::error::fingerprint depends on checkout path: $a vs $b"; exit 1; }
          echo "$a" > fingerprint.txt
          { echo "### aval-engine on ${{ matrix.os }}: \`$a\`"; echo '```'; ./bin/aval run --explain --fingerprint-only | sed '$d'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fingerprint-${{ matrix.os }}
          path: fingerprint.txt

  dogfood-compare:
    needs: dogfood-fingerprint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: fingerprint-*
      - name: Same fingerprint on every OS
        run: |
          cat fingerprint-*/fingerprint.txt
          test "$(cat fingerprint-*/fingerprint.txt | sort -u | wc -l)" -eq 1 || { echo "::error::fingerprint differs across OSes"; exit 1; }

  # Conventional commit PR title (CONTRIBUTING.md "Commits"). Squash merges
  # use the title as the commit message. The title goes through env, never
  # interpolated into the script, so `$(...)` in a title is not executed.
  # tests/architecture/hygiene_test.go checks the pattern with Go cases.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check conventional commit format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|chore|refactor|test|ci|perf|build|style)(\([^()]+\))?!?: [^ ].*$'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title must be a conventional commit: <type>[(scope)][!]: <description>"
            echo "::error::types: feat, fix, docs, chore, refactor, test, ci, perf, build, style"
            exit 1
          fi

  # The only required status check. Green only when no job failed or was
  # cancelled; jobs skipped by the path filter do not count as failures.
  required:
    if: always()
    needs:
      - changes
      - ci-static
      - ci-gates
      - ci-engine
      - ci-integration
      - ci-acceptance
      - ci-release
      - ci-fuzz
      - ci-security
      - ci-docs
      - dependency-review
      - dogfood-fingerprint
      - dogfood-compare
      - pr-title
    runs-on: ubuntu-latest
    steps:
      - name: Verify no job failed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for r in $results; do
            case "$r" in failure|cancelled) echo "::error::a CI job did not pass"; exit 1 ;; esac
          done
