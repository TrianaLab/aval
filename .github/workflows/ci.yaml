name: ci

# Each ci-* job runs the `make` leg of the same name, so `make ci` locally and
# this workflow stay one to one, except ci-e2e, which runs the same `aval run`
# with the pinned release (tests/architecture/ci_test.go pinnedLegs, #134).
# The `required` job aggregates every other job and is the only required
# status check; tests/architecture/ci_test.go fails if a job is not wired
# into it.

on:
  push:
    branches: [main]
  pull_request:
    # `edited` reruns the workflow when the title changes, so pr-title sees
    # the current title. Every job reruns: skipping the others on `edited`
    # would let `required` go green over a failed run on the same commit.
    types: [opened, edited, synchronize, reopened]
  # release.yaml version-pr dispatches this workflow on changeset-release/main
  # after changesets rewrites the version PR with GITHUB_TOKEN, a push that
  # starts no run. The `changes` job fails any other dispatched ref. A
  # dispatch run is treated as a PR against main: trust policy and registry
  # from main (trust-from-base.sh), AVAL_GOLDEN_BASE and the API base
  # origin/main, and every job with write scopes stays push-only.
  workflow_dispatch:

permissions:
  contents: read

# The aval release that jobs using Aval as a user would (the heavy suite ci-e2e, the demo and the dogfood shadow, publish and
# record jobs) install with .github/aval/install.sh,
# verified before use. The sha256 is that of aval_<version>_linux_amd64.tar.gz
# as checksums.txt lists it, so a re-tagged release cannot change what runs.
# Jobs that test the PR's code build from source (CONTRIBUTING.md "Which aval
# a CI job runs").
env:
  AVAL_VERSION: 0.7.0
  AVAL_SHA256: ca69a546f50902f12a7b22f65f520f3b9ed6ec296bdc576085aff35aa94102d8
  # The public stats registry (#97): dogfood-record publishes run records
  # there and docs.yaml (which names it too) builds the site's stats.json.
  AVAL_STATS_REGISTRY: ghcr.io/trianalab/aval-stats

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # Path filter: a change that touches only Markdown or docs/ cannot affect
  # the code legs, so they are skipped. ci-gates always runs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # Hygiene, not a trust boundary. A dispatched ref runs its
      # own ci.yaml, so whoever can push that ref controls this check anyway;
      # trust still comes from main and write scopes stay push-only.
      - name: Dispatch only on the version PR branch
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/changeset-release/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::ci.yaml is dispatched only on refs/heads/changeset-release/main, not $REF"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'

  ci-static:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true
      - run: make ci-static

  ci-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # TestEvidenceAPIIsAppendOnly compares the API snapshot with the
          # base revision (merge base with the PR base, `before` of the push
          # event, or the merge base with origin/main on a dispatch) and fails
          # when it cannot resolve it.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make ci-gates

  ci-engine:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make ci-engine
      # Informational: the 100% gate is enforced by `make ci-engine` above.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.gate.out
          fail_ci_if_error: false

  # The false-hit suite (#15): fails on any false hit in the corpus and on
  # a manifest change without a fingerprint.Version bump. No path filter, so
  # it runs on every PR, push and dispatch. Full history so
  # TestGoldensAppendOnly can diff the committed goldens against the PR base,
  # the previous push, or origin/main on a dispatch; it fails if
  # AVAL_GOLDEN_BASE does not resolve.
  ci-false-hit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make ci-false-hit
        env:
          AVAL_GOLDEN_BASE: ${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref || 'main') }}

  # Dogfooding M3 (#28): the heavy suite (levels 2 and 4, aval.e2e.yaml)
  # through `aval run`. A verified passing result for the same inputs is
  # reused instead of running it; anything unproven runs it (invariant 3). A
  # verification failure runs it and exits 5, which fails this job
  # (invariant 4). Read-only: GHCR is read anonymously and no token or OIDC
  # permission reaches the suite. If the package cannot be read anonymously,
  # every lookup is an error and the suite runs. On main, dogfood-publish
  # signs and pushes the recorded result, and dogfood-record publishes the
  # run record. The pinned, verified aval release decides reuse, not
  # `make ci-e2e` (#134): that would verify with bin/aval and the Makefile
  # from the PR. The suite itself (runner.command) still builds and tests the
  # PR. It needs ci-gates, so when the gates fail this check is skipped.
  ci-e2e:
    needs: [changes, ci-gates]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      AVAL_CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      AVAL_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      # tests/acceptance runs examples/uv-monorepo and fails without uv; this
      # is the uv version the example declares in environment.toolchain.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.18"
          enable-cache: false
      # AVAL_POLICY and AVAL_REGISTRY (#134): main reuses only this workflow
      # on main (main.yaml); a PR or dispatch also developer signatures, with
      # pr.yaml and the registry read from main. Both scripts are main's copies, run by
      # absolute path. If main has no trust-from-base.sh (before #134 lands),
      # no policy is set and nothing is reused. This step is still the PR's
      # own ci.yaml: on pull_request a hostile PR can make its own check
      # green; required code-owner review is what protects main.
      - name: Trust policy, registry and pinned aval release, from main
        run: |
          /usr/bin/git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          /usr/bin/git show origin/main:.github/aval/install.sh > "$RUNNER_TEMP/install.sh"
          if /usr/bin/git show origin/main:.github/aval/trust-from-base.sh > "$RUNNER_TEMP/trust-from-base.sh"; then
            /bin/bash "$RUNNER_TEMP/trust-from-base.sh"
          else
            echo "::warning::main has no .github/aval/trust-from-base.sh: no trust policy, nothing is reused"
          fi
          /bin/bash "$RUNNER_TEMP/install.sh"
      # --registry and --policy stay explicit even though aval reads
      # AVAL_REGISTRY and AVAL_POLICY: the trust source stays visible in the
      # command (#134).
      - name: Heavy suite through the pinned aval release
        run: |
          aval run -f aval.e2e.yaml --registry "$AVAL_REGISTRY" --policy "$AVAL_POLICY" \
            --result-file .aval/e2e-result.json --report-file .aval/e2e-report.json \
            --stats-file .aval/e2e-record.json --ci-run-url "$AVAL_CI_RUN_URL" --source-repo "$AVAL_REPOSITORY"
      - name: Summary
        if: always()
        run: .github/aval/summary.sh aval-e2e .aval/e2e-report.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aval-e2e
          path: |
            .aval/e2e-report.json
            .aval/e2e-result.json
            .aval/e2e-record.json
          include-hidden-files: true
          if-no-files-found: ignore

  # Release dry-run: the release build from .goreleaser.yaml as a snapshot
  # (unsigned: a PR gets no OIDC token), checked by tests/release. Runs on
  # every PR that changes code, which includes every release config change.
  ci-release:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.42.3
      - run: make ci-release
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sbom.json
            dist/checksums.txt
            dist/metadata.json
            dist/artifacts.json
          if-no-files-found: ignore
          retention-days: 7

  # Short fuzz run (FUZZTIME per target, see Makefile); the long run is
  # fuzz.yaml on a schedule. A crasher is uploaded so it can be committed as
  # a regression case.
  ci-fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make ci-fuzz
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore

  # govulncheck on PRs and main; security.yaml runs it on a schedule too,
  # since a new advisory can affect unchanged code.
  ci-security:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make ci-security

  # Docs gates: markdownlint, vale, CLI reference drift, the strict site
  # build with the "Try it" WebAssembly and its size budget, the headless
  # Chrome smoke tests of the "Try it" terminal (scripts/demo-smoke.mjs) and
  # of the mobile drawer (scripts/docs-nav-smoke.mjs; Node and Chrome come
  # with the runner image) and the deploy logic with the outdated banner check
  # (scripts/test-deploy-docs.sh, also headless Chrome).
  # No path filter: a docs-only PR must run it too. Links, doc examples, page
  # length and the image and recording size budget are checked in ci-gates.
  # On a PR it uploads the built site as the docs-site artifact for preview.
  ci-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Release binary checked against a pinned sha256; the version must equal
      # VALE_VERSION in the Makefile (`make docs-lint` refuses any other).
      - name: Install vale
        env:
          VALE_VERSION: 3.21.0
          VALE_SHA256: 96997d19a4ca6981673b0d4c5ca7f3ede4a9f97964a96edc29fba9e28a328336
        run: |
          tgz="$RUNNER_TEMP/vale.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors -o "$tgz" \
            "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          echo "$VALE_SHA256  $tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/vale" && tar -xzf "$tgz" -C "$RUNNER_TEMP/vale" vale
          echo "$RUNNER_TEMP/vale" >> "$GITHUB_PATH"
      # MkDocs for `make docs-site`, every package pinned by sha256.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r docs/requirements.txt
      - run: make ci-docs
      # The PR preview: download the artifact, unzip it and run
      # `python3 -m http.server -d <dir>` (CONTRIBUTING.md "Docs site").
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: site
          retention-days: 7

  # Fails a PR that adds a dependency with a known vulnerability. GitHub only
  # (needs the PR's dependency graph diff), so it has no `make` leg.
  # Skipped until a maintainer enables Settings > Code security > Dependency
  # graph and sets the repository variable DEPENDENCY_REVIEW=true; without the
  # dependency graph the action fails on every PR.
  dependency-review:
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # Live keyless signing (#6): Fulcio + Rekor on Sigstore public good with
  # this workflow's OIDC identity, then verification of the bundle. Runs on
  # push to main only, so no PR-triggered job gets `id-token: write`; every
  # other test uses in-process fakes. CI-only (needs the token), so it has
  # no `make` leg.
  sigstore-keyless:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -count=1 -tags sigstore_live -run '^TestKeylessSigningLive$' -v ./internal/attest

  # Milestone 3 demo (#11): examples/go-compose through GHCR with keyless
  # signing and examples/go-compose/policy.yaml, which trusts only this
  # workflow on main. Publish (or reuse a previous run's result), reuse
  # (hit), change the scope (miss), and an attestation signed with a key the
  # policy does not trust (exit 5, expected here). Push to main only: it
  # needs `packages: write` and `id-token: write`, which no PR-triggered job
  # gets. The same story runs locally in tests/acceptance (run_test.go).
  example-go-compose:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # docs/guides/github-actions.md includes the gha-* sections.
    # --8<-- [start:gha-permissions]
    permissions:
      contents: read
      packages: write
      id-token: write
    # --8<-- [end:gha-permissions]
    env:
      REPO: ghcr.io/trianalab/aval-example-go-compose
      CONTRACT: examples/go-compose/aval.yaml
      POLICY: examples/go-compose/policy.yaml
      SCOPED: examples/go-compose/counter/counter.go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Install the pinned aval release (verified)
        run: .github/aval/install.sh
      # --8<-- [start:gha-steps]
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "| step | outcome |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish (runs and pushes unless a verified result exists)
        run: |
          aval run -f "$CONTRACT" --registry "$REPO" --policy "$POLICY" --report-file publish.json
          if [ "$(jq -r .outcome publish.json)" != "verified" ]; then
            # The Actions OIDC token for Fulcio, fetched after the test so a
            # slow test cannot outlive it. aval push reads SIGSTORE_ID_TOKEN.
            SIGSTORE_ID_TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sigstore" | jq -r .value)
            export SIGSTORE_ID_TOKEN
            aval push -f "$CONTRACT" --registry "$REPO"
          fi
          echo "| publish | \`$(jq -r .outcome publish.json)\` |" >> "$GITHUB_STEP_SUMMARY"
      # --8<-- [end:gha-steps]
      - name: Unchanged scope reuses (hit)
        run: |
          aval run -f "$CONTRACT" --registry "$REPO" --policy "$POLICY" --report-file hit.json
          jq -e '.outcome == "verified"' hit.json
          echo "| unchanged scope | \`$(jq -r .outcome hit.json)\` (reused, test not run) |" >> "$GITHUB_STEP_SUMMARY"
      - name: Changed scope re-runs (miss)
        run: |
          # Unique per run, so this fingerprint was never published.
          echo "// demo change $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$SCOPED"
          aval run -f "$CONTRACT" --registry "$REPO" --policy "$POLICY" --report-file miss.json
          git checkout -- "$SCOPED"
          jq -e '.outcome == "miss"' miss.json
          echo "| changed scope | \`$(jq -r .outcome miss.json)\` (test ran) |" >> "$GITHUB_STEP_SUMMARY"
      - name: Untrusted attestation fails verification (exit 5, expected)
        run: |
          # A fixed scope change that someone published with their own key,
          # as anyone with write access to the repository could. Published
          # once; later runs find it already there.
          echo "// demo: published with an untrusted key" >> "$SCOPED"
          code=0; aval verify -f "$CONTRACT" --registry "$REPO" --policy "$POLICY" || code=$?
          if [ "$code" -eq 4 ]; then
            openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out "$RUNNER_TEMP/untrusted.key"
            aval run -f "$CONTRACT" --no-reuse
            aval push -f "$CONTRACT" --registry "$REPO" --key "$RUNNER_TEMP/untrusted.key"
          fi
          code=0; aval verify -f "$CONTRACT" --registry "$REPO" --policy "$POLICY" -o json > untrusted.json || code=$?
          git checkout -- "$SCOPED"
          cat untrusted.json
          test "$code" -eq 5 || { echo "::error::untrusted attestation: exit $code, want 5"; exit 1; }
          jq -e '.outcome == "verification-failed"' untrusted.json
          # Only the expected cause passes; any other verification failure
          # is a real security event and fails the job (invariant 4).
          # tests/architecture checks this literal still exists in the source.
          jq -e '.reason | contains("is not in the trust policy")' untrusted.json \
            || { echo "::error::untrusted attestation: unexpected verification failure: $(jq .reason untrusted.json)"; exit 1; }
          echo "::warning title=aval verification failed (expected in this demo)::$(jq .reason untrusted.json)"
          echo "| untrusted attestation | \`$(jq -r .outcome untrusted.json)\` (exit 5) |" >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-go-compose-reports
          path: '*.json'
          if-no-files-found: ignore

  # Dogfooding M1 (#28): Aval's own contract must fingerprint identically on
  # every OS and checkout path. Any difference is a determinism bug. CI-only
  # (needs several OSes), so it has no `make` leg.
  dogfood-fingerprint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fingerprint from two checkout paths
        env:
          OS: ${{ matrix.os }}
        run: |
          make build
          other="$RUNNER_TEMP/elsewhere/aval"
          mkdir -p "$(dirname "$other")" && cp -R . "$other"
          : > fingerprint.txt
          for f in aval.yaml aval.e2e.yaml; do
            a=$(./bin/aval explain --digest -f "$f")
            b=$(./bin/aval explain --digest -f "$other/$f")
            test "$a" = "$b" || { echo "::error::$f: fingerprint depends on checkout path: $a vs $b"; exit 1; }
            echo "$f $a" >> fingerprint.txt
            { echo "### $f on $OS: \`$a\`"; echo '```'; ./bin/aval explain -f "$f" | sed '$d'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fingerprint-${{ matrix.os }}
          path: fingerprint.txt

  dogfood-compare:
    needs: dogfood-fingerprint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fingerprint-*
      - name: Same fingerprint on every OS
        run: |
          cat fingerprint-*/fingerprint.txt
          files=(fingerprint-*/fingerprint.txt)
          for f in "${files[@]}"; do
            cmp -s "${files[0]}" "$f" || { echo "::error::fingerprints differ across OSes"; exit 1; }
          done

  # Dogfooding M2 (#28): shadow mode for the engine unit suite (aval.yaml).
  # `aval run --shadow` verifies a published result and runs the suite
  # anyway, so unit tests always run; a verified result that disagrees with
  # the run is a false hit and exits 1, a verification failure exits 5, and
  # both fail this job. The report goes up as an artifact in the
  # `aval verify --output json` format. Read-only, like ci-e2e.
  dogfood-shadow:
    needs: [changes, ci-gates]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      AVAL_CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      AVAL_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      # AVAL_POLICY and AVAL_REGISTRY (#134): main reuses only this workflow
      # on main (main.yaml); a PR or dispatch also developer signatures, with
      # pr.yaml and the registry read from main. Both scripts are main's copies, run by
      # absolute path. If main has no trust-from-base.sh (before #134 lands),
      # no policy is set and nothing is reused. This step is still the PR's
      # own ci.yaml: on pull_request a hostile PR can make its own check
      # green; required code-owner review is what protects main.
      - name: Trust policy, registry and pinned aval release, from main
        run: |
          /usr/bin/git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          /usr/bin/git show origin/main:.github/aval/install.sh > "$RUNNER_TEMP/install.sh"
          if /usr/bin/git show origin/main:.github/aval/trust-from-base.sh > "$RUNNER_TEMP/trust-from-base.sh"; then
            /bin/bash "$RUNNER_TEMP/trust-from-base.sh"
          else
            echo "::warning::main has no .github/aval/trust-from-base.sh: no trust policy, nothing is reused"
          fi
          /bin/bash "$RUNNER_TEMP/install.sh"
      - name: Shadow run of the engine unit suite
        run: |
          aval run --shadow -f aval.yaml --registry "$AVAL_REGISTRY" --policy "$AVAL_POLICY" \
            --result-file .aval/engine-result.json --report-file .aval/engine-report.json \
            --stats-file .aval/engine-record.json --ci-run-url "$AVAL_CI_RUN_URL" --source-repo "$AVAL_REPOSITORY"
      - name: Summary
        if: always()
        run: .github/aval/summary.sh aval-engine .aval/engine-report.json
      # Run statistics (#88): `aval stats` over the run records in the public
      # stats registry, read anonymously. Informational: it never fails the job.
      - name: Run statistics
        if: always()
        continue-on-error: true
        run: |
          {
            echo "### aval stats, last 30 days"
            echo '```'
            aval stats --registry "$AVAL_STATS_REGISTRY" --by repository --since 30d --registry-timeout 10m 2>&1 || echo "aval stats failed"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aval-shadow-engine
          path: |
            .aval/engine-report.json
            .aval/engine-result.json
            .aval/engine-record.json
          include-hidden-files: true
          if-no-files-found: ignore

  # Dogfooding M2 (#28): on main, sign keyless and push every result that
  # ci-e2e and dogfood-shadow recorded and did not reuse. Only this job gets
  # `id-token: write`; it and dogfood-record are the only jobs with
  # `packages: write`. It runs no tests, and it runs
  # only after both suites passed, so it publishes passing results only.
  # `aval push` refuses a result whose fingerprint differs from this
  # checkout's (same commit).
  dogfood-publish:
    needs: [ci-e2e, dogfood-shadow]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      # The one registry declaration: trust-from-base.sh reads it for the
      # suites, from main on pull requests.
      AVAL_REGISTRY: ghcr.io/trianalab/aval-attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: aval-*
          path: results
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Install the pinned aval release (verified)
        run: .github/aval/install.sh
      - name: Sign and push results that were not reused
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/docker"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for pair in aval.yaml:engine aval.e2e.yaml:e2e; do
            contract=${pair%%:*} name=${pair##*:}
            if jq -e '.outcome == "verified"' "results/$name-report.json" > /dev/null; then
              echo "$contract: reused a verified result, nothing to push"
              continue
            fi
            # A fresh OIDC token per push, fetched after the tests ran.
            SIGSTORE_ID_TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sigstore" | jq -r .value)
            export SIGSTORE_ID_TOKEN
            aval push -f "$contract" --registry "$AVAL_REGISTRY" --result-file "results/$name-result.json"
          done

  # Story 8.8 (#90): the one-line installers (scripts/get-aval.sh,
  # scripts/install.ps1) against Aval's real releases, including tampered
  # downloads served from a local mirror that must be refused. macOS runs the
  # bash installer with /bin/bash 3.2, as `curl | bash` does there; Windows
  # runs install.ps1 under PowerShell 7 and Windows PowerShell 5.1. CI-only
  # (needs three OSes and the network), so it has no `make` leg; shellcheck
  # runs in ci-static. No token reaches the scripts.
  installer:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: get-aval.sh, latest and pinned releases and tamper cases
        if: runner.os != 'Windows'
        run: /bin/bash scripts/test-get-aval.sh
      - name: get-aval.sh into the default directory (sudo only if needed)
        if: runner.os != 'Windows'
        run: |
          /bin/bash scripts/get-aval.sh
          test "$(command -v aval)" = /usr/local/bin/aval
          aval --version
      - name: install.ps1 under PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/test-install.ps1 -Shell pwsh
      - name: install.ps1 under Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/test-install.ps1 -Shell powershell

  # Run statistics (#87): on main, publish the run records that ci-e2e and
  # dogfood-shadow wrote, whatever their outcome (always(), so failed runs
  # count too). The suites run without credentials and write the record to a
  # file; this job has `packages: write` only, runs no tests, and publishes
  # with `aval stats publish` to the public stats registry (#97), a package of its
  # own so other repositories can be given write access to it without access
  # to the attestations; docs.yaml turns it into the site's stats.json.
  # Best-effort: a record that cannot be published is a warning. Records are
  # unsigned statistics; run and verify never read them.
  dogfood-record:
    needs: [changes, ci-e2e, dogfood-shadow]
    if: always() && needs.changes.outputs.code == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Statistics only (#86): every step is best-effort, so nothing here can
    # fail the job and turn main red.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: aval-*
          path: results
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        continue-on-error: true
        with:
          cosign-release: v3.0.6
      - name: Install the pinned aval release (verified)
        continue-on-error: true
        run: .github/aval/install.sh
      - name: Publish run records
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/docker"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin \
            || { echo "::warning title=aval run record::ghcr login failed; run records not published"; exit 0; }
          for name in engine e2e; do
            f="results/$name-record.json"
            if [ ! -f "$f" ]; then
              echo "::warning title=aval run record::$name: no run record to publish"
              continue
            fi
            aval stats publish --registry "$AVAL_STATS_REGISTRY" "$f" \
              || echo "::warning title=aval run record::$name: run record not published"
          done

  # Conventional commit PR title (CONTRIBUTING.md "Commits"). Squash merges
  # use the title as the commit message. The title goes through env, never
  # interpolated into the script, so `$(...)` in a title is not executed.
  # tests/architecture/hygiene_test.go checks the pattern with Go cases.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check conventional commit format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|chore|refactor|test|ci|perf|build|style)(\([^()]+\))?!?: [^ ].*$'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title must be a conventional commit: <type>[(scope)][!]: <description>"
            echo "::error::types: feat, fix, docs, chore, refactor, test, ci, perf, build, style"
            exit 1
          fi

  # The only required status check. Green only when no job failed or was
  # cancelled; jobs skipped by the path filter do not count as failures.
  required:
    if: always()
    needs:
      - changes
      - ci-static
      - ci-gates
      - ci-engine
      - ci-false-hit
      - ci-e2e
      - ci-release
      - ci-fuzz
      - ci-security
      - ci-docs
      - dependency-review
      - sigstore-keyless
      - example-go-compose
      - dogfood-fingerprint
      - dogfood-compare
      - dogfood-shadow
      - dogfood-publish
      - installer
      - dogfood-record
      - pr-title
    runs-on: ubuntu-latest
    steps:
      - name: Verify no job failed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for r in $results; do
            case "$r" in failure|cancelled) echo "::error::a CI job did not pass"; exit 1 ;; esac
          done
