name: ci

# Each ci-* job runs the `make` leg of the same name, so `make ci` locally and
# this workflow stay one to one, except ci-e2e, which runs the same test
# through integrations/github/run and its pinned release
# (tests/architecture/ci_test.go pinnedLegs, #134, #216).
# The `required` job aggregates every other job and is the only required
# status check; tests/architecture/ci_test.go fails if a job is not wired
# into it.

on:
  push:
    branches: [main]
  pull_request:
    # `edited` reruns the workflow when the title changes, so pr-title sees
    # the current title. Every job reruns: skipping the others on `edited`
    # would let `required` go green over a failed run on the same commit.
    types: [opened, edited, synchronize, reopened]
  # release.yaml's version-pr-ci job dispatches this workflow on
  # changeset-release/main after changesets rewrites the version PR with
  # GITHUB_TOKEN, a push that starts no run, and its pin-actions-ci job on
  # release-pins/main after each release (#213). The `changes` job fails any
  # other dispatched ref. A dispatch run is treated as a PR against main: trust
  # policy and registry from main (integrations/github/run reads them there on
  # every event), developer signatures accepted, AVAL_GOLDEN_BASE and the API
  # base origin/main, and every job with write scopes stays push-only.
  # pr-title and dependency-review are pull_request-only and skip on purpose:
  # release.yaml fixes the title, and the version PR only bumps the version in
  # package.json and package-lock.json.
  workflow_dispatch:

permissions:
  contents: read

# The jobs that use Aval as a user would (ci-e2e, dogfood-shadow,
# dogfood-publish) go through integrations/github/run and publish (#216),
# which install the aval release pinned in their action.yml, verified before
# use. Jobs that test the commit's code build from source (CONTRIBUTING.md
# "Which aval a CI job runs").
env:
  # The public stats registry (#97): dogfood-record publishes run records
  # there and docs.yaml (which names it too) builds the site's stats.json.
  AVAL_STATS_REGISTRY: ghcr.io/trianalab/aval-stats

# event_name keeps a dispatch on main (by mistake or on purpose) from
# cancelling main's push run, which auto-tag and dogfood-publish depend on.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # Path filter: a change that touches only Markdown or docs/ cannot affect
  # the code legs, so they are skipped. ci-gates always runs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # Hygiene, not a trust boundary. A dispatched ref runs its own ci.yaml,
      # so whoever can push that ref controls this check anyway; trust still
      # comes from main and write scopes stay push-only.
      - name: Dispatch only on the version and pin PR branches
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/changeset-release/main' && github.ref != 'refs/heads/release-pins/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::ci.yaml is dispatched only on refs/heads/changeset-release/main or refs/heads/release-pins/main, not $REF"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'

  ci-static:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true
      # zizmor for `make lint-actions`, pinned by sha256.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r .github/requirements-lint.txt
      - run: make ci-static

  ci-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # TestEvidenceAPIIsAppendOnly compares the API snapshot with the
          # base revision (merge base with the PR base, `before` of the push
          # event, or the merge base with origin/main on a dispatch) and fails
          # when it cannot resolve it.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make ci-gates

  ci-engine:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make ci-engine
      # Informational: the 100% gate is enforced by `make ci-engine` above.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.gate.out
          fail_ci_if_error: false

  # The false-hit suite (#15): fails on any false hit in the corpus and on
  # a manifest change without a fingerprint.Version bump. No path filter, so
  # it runs on every PR, push and dispatch. Full history so
  # TestGoldensAppendOnly can diff the committed goldens against the PR base,
  # the previous push, or origin/main on a dispatch; it fails if
  # AVAL_GOLDEN_BASE does not resolve.
  ci-false-hit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make ci-false-hit
        env:
          AVAL_GOLDEN_BASE: ${{ github.event_name == 'push' && (github.event.before || 'no-push-before') || format('origin/{0}', github.base_ref || 'main') }}

  # Dogfooding M3 (#28): the heavy suite (levels 2 and 4, aval-e2e in
  # aval.yaml) through integrations/github/run (#216). A verified passing
  # result for the same inputs is reused instead of running it; anything
  # unproven runs it (invariant 3). A verification failure exits 5, which
  # fails this job (invariant 4). The action fetches the trust policy, and
  # the registry inside it, from main through the contents API, never from
  # the checkout; installs its pinned, verified aval release; and refuses a
  # job with id-token. GHCR is read anonymously. On main, the action uploads
  # the result as the artifact aval-aval-e2e, which dogfood-publish signs and
  # pushes. The suite itself (runner.command) builds and tests the PR. It
  # needs ci-gates, so when the gates fail this check is skipped.
  ci-e2e:
    needs: [changes, ci-gates]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      # One policy (.github/aval/policy.yaml, #214): main reuses only ci.yaml
      # on main (runner level); a PR or dispatch also a maintainer's
      # developer signature. Empty means the policy's minimum.
      AVAL_MIN_TRUST_LEVEL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'runner' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # tests/acceptance runs examples/uv-monorepo and fails without uv; this
      # is the uv version aval-e2e declares in environment.toolchain.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.18"
          enable-cache: false
      - uses: ./integrations/github/run
        with:
          test: aval-e2e

  # Release dry-run: the release build from .goreleaser.yaml as a snapshot
  # (unsigned: a PR gets no OIDC token), checked by tests/release. Runs on
  # every PR that changes code, which includes every release config change.
  ci-release:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.42.3
      - run: make ci-release
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sbom.json
            dist/checksums.txt
            dist/metadata.json
            dist/artifacts.json
          if-no-files-found: ignore
          retention-days: 7

  # Short fuzz run (FUZZTIME per target, see Makefile); the long run is
  # fuzz.yaml on a schedule. A crasher is uploaded so it can be committed as
  # a regression case.
  ci-fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make ci-fuzz
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore

  # govulncheck on PRs and main; security.yaml runs it on a schedule too,
  # since a new advisory can affect unchanged code.
  ci-security:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make ci-security

  # Docs gates: markdownlint, vale, CLI reference drift, the strict site
  # build with the "Try it" WebAssembly and its size budget, the headless
  # Chrome smoke tests of the "Try it" terminal (scripts/demo-smoke.mjs) and
  # of the mobile drawer (scripts/docs-nav-smoke.mjs; Node and Chrome come
  # with the runner image) and the deploy logic with the outdated banner check
  # (scripts/test-deploy-docs.sh, also headless Chrome).
  # No path filter: a docs-only PR must run it too. Links, doc examples, page
  # length and the image and recording size budget are checked in ci-gates.
  # On a PR it uploads the built site as the docs-site artifact for preview.
  ci-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Release binary checked against a pinned sha256; the version must equal
      # VALE_VERSION in the Makefile (`make docs-lint` refuses any other).
      - name: Install vale
        env:
          VALE_VERSION: 3.21.0
          VALE_SHA256: 96997d19a4ca6981673b0d4c5ca7f3ede4a9f97964a96edc29fba9e28a328336
        run: |
          tgz="$RUNNER_TEMP/vale.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors -o "$tgz" \
            "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          echo "$VALE_SHA256  $tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/vale" && tar -xzf "$tgz" -C "$RUNNER_TEMP/vale" vale
          echo "$RUNNER_TEMP/vale" >> "$GITHUB_PATH"
      # MkDocs for `make docs-site`, every package pinned by sha256.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r docs/requirements.txt
      - run: make ci-docs
      # The PR preview: download the artifact, unzip it and run
      # `python3 -m http.server -d <dir>` (CONTRIBUTING.md "Docs site").
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: site
          retention-days: 7

  # Fails a PR that adds a dependency with a known vulnerability. GitHub only
  # (needs the PR's dependency graph diff), so it has no `make` leg.
  # Skipped until a maintainer enables Settings > Code security > Dependency
  # graph and sets the repository variable DEPENDENCY_REVIEW=true; without the
  # dependency graph the action fails on every PR.
  dependency-review:
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # Live keyless signing (#6): Fulcio + Rekor on Sigstore public good with
  # this workflow's OIDC identity, then verification of the bundle. Runs on
  # push to main only, so no PR-triggered job gets `id-token: write`; every
  # other test uses in-process fakes. CI-only (needs the token), so it has
  # no `make` leg.
  sigstore-keyless:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -count=1 -tags sigstore_live -run '^TestKeylessSigningLive$' -v ./internal/attest

  # Milestone 3 demo (#11): examples/go-compose through GHCR with keyless
  # signing and examples/go-compose/policy.yaml, which trusts only this
  # workflow on main. Publish (or reuse a previous run's result), reuse
  # (hit), change the scope (miss), and an attestation signed with a key the
  # policy does not trust (exit 5, expected here). Push to main only: it
  # needs `packages: write` and `id-token: write`, which no PR-triggered job
  # gets. The same story runs locally in tests/acceptance (run_test.go).
  # aval is built from the commit, as in publish-action (#216).
  example-go-compose:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      REPO: ghcr.io/trianalab/aval-example-go-compose
      CONTRACT: examples/go-compose/aval.yaml
      POLICY: examples/go-compose/policy.yaml
      SCOPED: examples/go-compose/counter/counter.go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build aval
        run: |
          go build -o "$RUNNER_TEMP/bin/aval" ./cmd/aval
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "| step | outcome |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish (runs and pushes unless a verified result exists)
        run: |
          aval run -f "$CONTRACT" --registry "$REPO" --policy "$POLICY" --report-file publish.json
          # The Actions OIDC token for Fulcio, fetched after the test so a
          # slow test cannot outlive it. aval push reads SIGSTORE_ID_TOKEN;
          # with --report-file it signs nothing when the run reused (#201).
          SIGSTORE_ID_TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sigstore" | jq -r .value)
          export SIGSTORE_ID_TOKEN
          aval push -f "$CONTRACT" --registry "$REPO" --report-file publish.json
          echo "| publish | \`$(jq -r .outcome publish.json)\` |" >> "$GITHUB_STEP_SUMMARY"
      - name: Unchanged scope reuses (hit)
        run: |
          aval run -f "$CONTRACT" --registry "$REPO" --policy "$POLICY" --report-file hit.json
          jq -e '.outcome == "verified"' hit.json
          echo "| unchanged scope | \`$(jq -r .outcome hit.json)\` (reused, test not run) |" >> "$GITHUB_STEP_SUMMARY"
      - name: Changed scope re-runs (miss)
        run: |
          # Unique per run, so this fingerprint was never published.
          echo "// demo change $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$SCOPED"
          aval run -f "$CONTRACT" --registry "$REPO" --policy "$POLICY" --report-file miss.json
          git checkout -- "$SCOPED"
          jq -e '.outcome == "miss"' miss.json
          echo "| changed scope | \`$(jq -r .outcome miss.json)\` (test ran) |" >> "$GITHUB_STEP_SUMMARY"
      - name: Untrusted attestation fails verification (exit 5, expected)
        run: |
          # A fixed scope change that someone published with their own key,
          # as anyone with write access to the repository could. Published
          # once; later runs find it already there.
          echo "// demo: published with an untrusted key" >> "$SCOPED"
          code=0; aval verify -f "$CONTRACT" --registry "$REPO" --policy "$POLICY" || code=$?
          if [ "$code" -eq 4 ]; then
            openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out "$RUNNER_TEMP/untrusted.key"
            aval run -f "$CONTRACT" --no-reuse
            aval push -f "$CONTRACT" --registry "$REPO" --key "$RUNNER_TEMP/untrusted.key"
          fi
          code=0; aval verify -f "$CONTRACT" --registry "$REPO" --policy "$POLICY" -o json > untrusted.json || code=$?
          git checkout -- "$SCOPED"
          cat untrusted.json
          test "$code" -eq 5 || { echo "::error::untrusted attestation: exit $code, want 5"; exit 1; }
          jq -e '.outcome == "verification-failed"' untrusted.json
          # Only the expected cause passes; any other verification failure
          # is a real security event and fails the job (invariant 4).
          # tests/architecture checks this literal still exists in the source.
          jq -e '.reason | contains("is not in the trust policy")' untrusted.json \
            || { echo "::error::untrusted attestation: unexpected verification failure: $(jq .reason untrusted.json)"; exit 1; }
          echo "::warning title=aval verification failed (expected in this demo)::$(jq .reason untrusted.json)"
          echo "| untrusted attestation | \`$(jq -r .outcome untrusted.json)\` (exit 5) |" >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-go-compose-reports
          path: '*.json'
          if-no-files-found: ignore

  # The publish action (#212) on Aval's own main: a suite job uploads three
  # aval-* artifacts, one carrying a declared output as the run action does
  # (#236); the publish job runs the action's scripts, which sign
  # each with a fresh OIDC token of this job, and aval verify then accepts
  # them under integrations/github/publish/testdata/policy.yaml, which trusts
  # only ci.yaml on main: the certificate names the calling workflow, not
  # integrations/github/publish. bin/aval is built from the commit, because
  # the action's pinned release has no --outputs-dir yet. The artifacts are
  # named suite-*, not aval-*: dogfood-publish runs the action, which
  # downloads every aval-* artifact of the run.
  # TODO(milestone-14): uses: ./integrations/github/publish once its pin has --outputs-dir (#213, #236).
  publish-action-suite:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run the three tests
        run: |
          go build -o bin/aval ./cmd/aval
          # Run id only: a re-run of publish-action alone must recompute the
          # fingerprint of the suite job's first-attempt artifacts.
          echo "$GITHUB_RUN_ID" > integrations/github/publish/testdata/run-id
          # --outputs-dir as integrations/github/run/run.sh passes it.
          for t in publish-a publish-b publish-outputs; do
            bin/aval run -f integrations/github/publish/testdata/aval.yaml --test "$t" --outputs-dir ".aval/$t/outputs"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suite-publish-a
          path: .aval/publish-a/
          include-hidden-files: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suite-publish-b
          path: .aval/publish-b/
          include-hidden-files: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suite-publish-outputs
          path: .aval/publish-outputs/
          include-hidden-files: true
      # The run action's scripts on examples/github-monorepo's unit test, whose
      # artifact carries its output coverage.out (#236). The policy trusts
      # ci.yaml on main, so once published the result is reused (coverage.out
      # restored) until unit's inputs change, and nothing piles up under one
      # fingerprint.
      - name: The run action's scripts on the example's unit test
        working-directory: examples/github-monorepo
        env:
          INPUT_TEST: unit
          INPUT_FILE: aval.yaml
          INPUT_POLICY: integrations/github/publish/testdata/policy.yaml
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          AVAL="$GITHUB_WORKSPACE/bin/aval" /bin/bash ../../integrations/github/run/guard.sh
          AVAL="$GITHUB_WORKSPACE/bin/aval" /bin/bash ../../integrations/github/run/run.sh
      # Not aval-*: dogfood-publish's action downloads those.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-github-monorepo-unit
          path: examples/github-monorepo/.aval/unit/
          include-hidden-files: true

  publish-action:
    needs: [changes, publish-action-suite]
    if: needs.changes.outputs.code == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build aval
        run: |
          go build -o bin/aval ./cmd/aval
          # Run id only: a re-run of publish-action alone must recompute the
          # fingerprint of the suite job's first-attempt artifacts.
          echo "$GITHUB_RUN_ID" > integrations/github/publish/testdata/run-id
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Only the suite's artifacts, renamed to the aval-<test> layout the
          # action's script reads.
          pattern: suite-publish-*
          path: ${{ runner.temp }}/aval-artifacts
      - name: Rename the suite's artifacts
        env:
          ARTIFACTS: ${{ runner.temp }}/aval-artifacts
        run: for d in "$ARTIFACTS"/suite-*; do mv "$d" "$ARTIFACTS/aval-${d##*/suite-}"; done
      - name: Publish with the action's scripts
        env:
          ALLOW_UNPROTECTED: "false"
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ARTIFACTS: ${{ runner.temp }}/aval-artifacts
          INPUT_FILE: integrations/github/publish/testdata/aval.yaml
          INPUT_POLICY: integrations/github/publish/testdata/policy.yaml
          INPUT_STATS: "false"
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          AVAL="$PWD/bin/aval" /bin/bash integrations/github/publish/guard.sh
          AVAL="$PWD/bin/aval" /bin/bash integrations/github/publish/publish.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: example-github-monorepo-unit
          path: ${{ runner.temp }}/monorepo-artifacts/aval-unit
      - name: Publish the example's unit test with the action's scripts
        working-directory: examples/github-monorepo
        env:
          ALLOW_UNPROTECTED: "false"
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ARTIFACTS: ${{ runner.temp }}/monorepo-artifacts
          INPUT_FILE: aval.yaml
          INPUT_POLICY: integrations/github/publish/testdata/policy.yaml
          INPUT_STATS: "false"
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          AVAL="$GITHUB_WORKSPACE/bin/aval" /bin/bash ../../integrations/github/publish/guard.sh
          AVAL="$GITHUB_WORKSPACE/bin/aval" /bin/bash ../../integrations/github/publish/publish.sh
      - name: The certificates name ci.yaml on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for t in publish-a publish-b publish-outputs; do
            bin/aval verify -f integrations/github/publish/testdata/aval.yaml --test "$t" --policy integrations/github/publish/testdata/policy.yaml
          done
          bin/aval verify -f examples/github-monorepo/aval.yaml --test unit --policy integrations/github/publish/testdata/policy.yaml

  # The run action on examples/github-monorepo (#217), on every event
  # against the real contents API: the PR edits the example's trust policy
  # to trust any GitHub workflow, registry included, and the action must
  # still use the default branch's copy (or none, before it exists there),
  # so nothing the edit trusts is reused. bin/aval is built from the commit,
  # because the example's unit test declares outputs and the action's pinned
  # release has no --outputs-dir yet.
  # TODO(milestone-14): uses: ./integrations/github/run once its pin has --outputs-dir (#213, #236).
  example-github-monorepo:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/github-monorepo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build aval
        working-directory: .
        run: go build -o "$RUNNER_TEMP/aval" ./cmd/aval
      - name: The pull request edits the trust policy
        run: |
          cat > .github/aval/policy.yaml <<'EOF'
          apiVersion: aval.trianalab.io/v1
          kind: Policy
          registry: ghcr.io/attacker/results
          minTrustLevel: developer
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegexp: https://github\.com/.*
              trustLevel: isolated
          EOF
      - name: The run action's scripts
        id: run
        env:
          INPUT_TEST: unit
          INPUT_FILE: aval.yaml
          INPUT_POLICY: examples/github-monorepo/.github/aval/policy.yaml
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # pipefail: an exit 5 from run.sh must fail the step through tee.
          set -o pipefail
          AVAL="$RUNNER_TEMP/aval" /bin/bash ../../integrations/github/run/guard.sh
          AVAL="$RUNNER_TEMP/aval" /bin/bash ../../integrations/github/run/run.sh | tee "$RUNNER_TEMP/run.log"
      - name: The policy edited in the PR was ignored
        env:
          OUTCOME: ${{ steps.run.outputs.outcome }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          fetched="$RUNNER_TEMP/aval-policy-unit.yaml"
          path=examples/github-monorepo/.github/aval/policy.yaml
          /usr/bin/git fetch --no-tags --depth=1 origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          if /usr/bin/git show "origin/$DEFAULT_BRANCH:$path" > "$RUNNER_TEMP/main-policy.yaml" 2> /dev/null; then
            cmp "$fetched" "$RUNNER_TEMP/main-policy.yaml"
          else
            test ! -e "$fetched"
            grep -q "no trust policy at $path in the default branch" "$RUNNER_TEMP/run.log"
          fi
          if [ -e "$fetched" ] && cmp -s "$fetched" .github/aval/policy.yaml; then
            echo "::error::the run action used the policy from the checkout"
            exit 1
          fi
          if grep -q attacker "$RUNNER_TEMP/run.log" || [ "$OUTCOME" = verified ]; then
            echo "::error::the run action trusted the PR's policy (outcome $OUTCOME)"
            exit 1
          fi
          echo "outcome $OUTCOME: the PR's policy was ignored"

  # Dogfooding M1 (#28): Aval's own contract must fingerprint identically on
  # every OS and checkout path. Any difference is a determinism bug. CI-only
  # (needs several OSes), so it has no `make` leg.
  dogfood-fingerprint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fingerprint from two checkout paths
        env:
          OS: ${{ matrix.os }}
        run: |
          make build
          other="$RUNNER_TEMP/elsewhere/aval"
          mkdir -p "$(dirname "$other")" && cp -R . "$other"
          : > fingerprint.txt
          for t in aval-engine aval-e2e; do
            a=$(./bin/aval explain --digest -f aval.yaml --test "$t")
            b=$(./bin/aval explain --digest -f "$other/aval.yaml" --test "$t")
            test "$a" = "$b" || { echo "::error::$t: fingerprint depends on checkout path: $a vs $b"; exit 1; }
            echo "$t $a" >> fingerprint.txt
            { echo "### $t on $OS: \`$a\`"; echo '```'; ./bin/aval explain -f aval.yaml --test "$t" | sed '$d'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fingerprint-${{ matrix.os }}
          path: fingerprint.txt

  dogfood-compare:
    needs: dogfood-fingerprint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fingerprint-*
      - name: Same fingerprint on every OS
        run: |
          cat fingerprint-*/fingerprint.txt
          files=(fingerprint-*/fingerprint.txt)
          for f in "${files[@]}"; do
            cmp -s "${files[0]}" "$f" || { echo "::error::fingerprints differ across OSes"; exit 1; }
          done

  # Dogfooding M2 (#28): shadow mode for the engine unit suite (aval-engine
  # in aval.yaml) through integrations/github/run with shadow: true (#216).
  # `aval run --shadow` verifies a published result and runs the suite
  # anyway, so unit tests always run; a verified result that disagrees with
  # the run is a false hit and exits 1, a verification failure exits 5, and
  # both fail this job. Read-only, like ci-e2e; on main the action uploads
  # aval-aval-engine for dogfood-publish.
  dogfood-shadow:
    needs: [changes, ci-gates]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      # As in ci-e2e (#214).
      AVAL_MIN_TRUST_LEVEL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'runner' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: ./integrations/github/run
        with:
          test: aval-engine
          shadow: "true"
      # Run statistics (#88), informational: never fails the job. aval is built
      # from the commit and reads the public stats registry anonymously; records
      # are unsigned statistics that run and verify never read.
      - name: Run statistics
        if: always()
        continue-on-error: true
        run: |
          go build -o "$RUNNER_TEMP/stats-bin/aval" ./cmd/aval
          {
            echo "### aval stats, last 30 days"
            echo '```'
            "$RUNNER_TEMP/stats-bin/aval" stats --registry "$AVAL_STATS_REGISTRY" --by repository --since 30d --registry-timeout 10m 2>&1 || echo "aval stats failed"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Dogfooding M2 (#28): on main, integrations/github/publish (#216) signs
  # keyless and pushes every result that ci-e2e and dogfood-shadow uploaded
  # and did not reuse (aval push --report-file signs nothing for a reused
  # result), to the registry in main's .github/aval/policy.yaml. Only this
  # job of the dogfood jobs gets `id-token: write`; the suites have none. It
  # runs no tests, and it runs only after both suites passed, so it publishes
  # passing results only. `aval push` refuses a result whose fingerprint
  # differs from this checkout's (same commit).
  dogfood-publish:
    needs: [ci-e2e, dogfood-shadow]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: ./integrations/github/publish

  # Story 8.8 (#90): the one-line installers (scripts/get-aval.sh,
  # scripts/install.ps1) against Aval's real releases, including tampered
  # downloads served from a local mirror that must be refused. macOS runs the
  # bash installer with /bin/bash 3.2, as `curl | bash` does there; Windows
  # runs install.ps1 under PowerShell 7 and Windows PowerShell 5.1. CI-only
  # (needs three OSes and the network), so it has no `make` leg; shellcheck
  # runs in ci-static. No token reaches the scripts.
  installer:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: get-aval.sh, latest and pinned releases and tamper cases
        if: runner.os != 'Windows'
        run: /bin/bash scripts/test-get-aval.sh
      - name: get-aval.sh into the default directory (sudo only if needed)
        if: runner.os != 'Windows'
        run: |
          /bin/bash scripts/get-aval.sh
          test "$(command -v aval)" = /usr/local/bin/aval
          aval --version
      - name: install.ps1 under PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/test-install.ps1 -Shell pwsh
      - name: install.ps1 under Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/test-install.ps1 -Shell powershell

  # Run statistics (#87): on main, publish the run records that ci-e2e and
  # dogfood-shadow wrote into their aval-* artifacts, whatever their outcome
  # (always(), so failed runs count too). The suites run without credentials;
  # this job has `packages: write` only, runs no tests, and publishes with
  # `aval stats publish` to the public stats registry (#97), a package of its
  # own so other repositories can be given write access to it without access
  # to the attestations; docs.yaml turns it into the site's stats.json.
  # aval is built from the commit: records are unsigned statistics that run
  # and verify never read. Best-effort: a record that cannot be published is
  # a warning.
  dogfood-record:
    needs: [changes, ci-e2e, dogfood-shadow]
    if: always() && needs.changes.outputs.code == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Statistics only (#86): every step is best-effort, so nothing here can
    # fail the job and turn main red.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        continue-on-error: true
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: aval-*
          path: ${{ runner.temp }}/results
      - name: Publish run records
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ runner.temp }}/results
        run: |
          go build -o "$RUNNER_TEMP/aval" ./cmd/aval
          export DOCKER_CONFIG="$RUNNER_TEMP/docker"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin \
            || { echo "::warning title=aval run record::ghcr login failed; run records not published"; exit 0; }
          for name in aval-engine aval-e2e; do
            f="$RESULTS/aval-$name/record.json"
            if [ ! -f "$f" ]; then
              echo "::warning title=aval run record::$name: no run record to publish"
              continue
            fi
            "$RUNNER_TEMP/aval" stats publish --registry "$AVAL_STATS_REGISTRY" "$f" \
              || echo "::warning title=aval run record::$name: run record not published"
          done

  # Conventional commit PR title (CONTRIBUTING.md "Commits"). Squash merges
  # use the title as the commit message. The title goes through env, never
  # interpolated into the script, so `$(...)` in a title is not executed.
  # tests/architecture/hygiene_test.go checks the pattern with Go cases.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check conventional commit format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|chore|refactor|test|ci|perf|build|style)(\([^()]+\))?!?: [^ ].*$'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title must be a conventional commit: <type>[(scope)][!]: <description>"
            echo "::error::types: feat, fix, docs, chore, refactor, test, ci, perf, build, style"
            exit 1
          fi

  # The only required status check. Green only when no job failed or was
  # cancelled; jobs skipped by the path filter do not count as failures.
  required:
    if: always()
    needs:
      - changes
      - ci-static
      - ci-gates
      - ci-engine
      - ci-false-hit
      - ci-e2e
      - ci-release
      - ci-fuzz
      - ci-security
      - ci-docs
      - dependency-review
      - sigstore-keyless
      - example-go-compose
      - publish-action-suite
      - publish-action
      - example-github-monorepo
      - dogfood-fingerprint
      - dogfood-compare
      - dogfood-shadow
      - dogfood-publish
      - installer
      - dogfood-record
      - pr-title
    runs-on: ubuntu-latest
    steps:
      - name: Verify no job failed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for r in $results; do
            case "$r" in failure|cancelled) echo "::error::a CI job did not pass"; exit 1 ;; esac
          done
