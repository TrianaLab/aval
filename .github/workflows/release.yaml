name: release

# Changesets drive the version: each PR adds a .changeset/*.md entry, and on
# main the version-pr job keeps a "chore: version packages" PR open that
# applies them (package.json version, CHANGELOG.md). Once ci passes on the
# merge commit, auto-tag (on workflow_run of ci) tags it v<package.json
# version> and dispatches this workflow on the tag; the release job dispatches
# docs.yaml once the release exists. A tag created with GITHUB_TOKEN triggers
# no workflow, but a dispatch does, so the release job still runs on refs/tags/v<version> and signs with the
# release.yaml@refs/tags/<tag> identity tests/release requires. A maintainer
# can still push a tag by hand. The release job builds, signs and attests,
# verifies dist/ with tests/release, and only then creates the GitHub Release.
# A tag that does not match package.json fails verification and publishes
# nothing.
#
# Write scopes only on push to main, on a tag, or on a successful ci run of a
# push to main (workflow_run runs this file from main and checks out only that
# main commit), never on pull_request; the PR-side dry-run is the ci-release
# job in ci.yaml.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  # auto-tag dispatches the release on the tag; a dispatch on a branch runs no job.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_run' && 'auto-tag' || github.ref }}
  cancel-in-progress: false

jobs:
  version-pr:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      # changesets/action v2 input names (version-script, pr-title,
      # commit-message, github-token). Publishes nothing: no publish script.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ github.token }}
          version-script: npm run release:version
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'

  # Tags the merge of the version PR (or the first green commit after it with
  # no pending changeset). Releases nothing unless the tag does not exist yet,
  # the version is newer than every v* tag, the commit is on main and no
  # changeset is pending. Runs no code from the checkout
  # (tests/architecture/release_workflow_test.go).
  auto-tag:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag
      actions: write # dispatch release.yaml on the tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Tag a merged version PR and dispatch the release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag="v$(jq -r .version package.json)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::bad version in package.json: $tag"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            if ! gh release view "$tag" > /dev/null 2>&1; then
              echo "::warning title=tag without release::$tag exists but has no GitHub Release; run: gh workflow run release.yaml --ref $tag"
            fi
            echo "$tag exists: nothing to release"; exit 0
          fi
          latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$tag" | sort -V | tail -1)" != "$tag" ]; then
            echo "$tag is older than $latest: not tagging"; exit 0
          fi
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "$SHA is no longer on main: not tagging"; exit 0
          fi
          pending=$(find .changeset -name '*.md' ! -name README.md 2> /dev/null || true)
          if [ -n "$pending" ]; then
            echo "::warning title=unreleased version::$tag is not tagged and changesets are pending; if the version PR is merged, tag it by hand: git tag $tag <version-merge-sha> && git push origin $tag"
            echo "$pending"; exit 0
          fi
          # A tag created with GITHUB_TOKEN triggers no workflow: dispatch it.
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$SHA" > /dev/null
          gh workflow run release.yaml --ref "$tag"
          echo "::notice title=release dispatched::tagged $SHA as $tag"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      actions: write # dispatch docs.yaml on the tag once the release exists
      id-token: write # keyless signing (cosign) and provenance
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Dogfooding (#28): the tagged commit must carry a verified, passing
      # result of the heavy suite (aval.e2e.yaml), signed by ci.yaml on main
      # (.github/aval/main.yaml). The fingerprint is computed from this
      # checkout. A miss (exit 4) or any error stops the release; a
      # verification failure (exit 5) is a security event and stops it too.
      # GHCR is read anonymously; no token reaches aval.
      - name: Require a verified e2e attestation for this commit
        env:
          AVAL_REGISTRY: ghcr.io/trianalab/aval-attestations
        run: |
          make build
          # The report goes outside the work tree: GoReleaser refuses a dirty one.
          code=0
          ./bin/aval verify -f aval.e2e.yaml --registry "$AVAL_REGISTRY" --policy .github/aval/main.yaml -o json > "$RUNNER_TEMP/e2e-verify.json" || code=$?
          .github/aval/summary.sh aval-e2e "$RUNNER_TEMP/e2e-verify.json"
          if [ "$code" -ne 0 ]; then
            echo "::error title=no verified e2e attestation::aval verify exited $code; wait for ci.yaml on main to publish the e2e result for this commit, then re-run"
            exit 1
          fi
          jq -e '.outcome == "verified" and .result == "passed"' "$RUNNER_TEMP/e2e-verify.json" > /dev/null \
            || { echo "::error title=e2e attestation is not a pass::the verified e2e result for this commit did not pass"; exit 1; }
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.42.3
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Build, checksum, SBOM and sign (nothing is published yet)
        run: |
          make goreleaser
          bin/goreleaser release --clean --skip=publish
      - name: SLSA provenance for every file in checksums.txt
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Add the provenance bundle to the release files
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" dist/provenance.sigstore.json
      - name: Verify the artifacts match what the release claims
        env:
          AVAL_RELEASE_DIST: ${{ github.workspace }}/dist
          AVAL_RELEASE_TAG: ${{ github.ref_name }}
        run: go test -count=1 -v ./tests/release/...
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v h="## ${TAG#v}" '$0 == h {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has no section for ${TAG#v}"; exit 1; }
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # Uploads only what tests/release verified: the files checksums.txt
        # lists, plus checksums.txt and its two bundles. No globs; the test
        # TestReleaseWorkflowVerifiesBeforePublishing pins this command.
        run: |
          mapfile -t files < <(awk '{print "dist/" $2}' dist/checksums.txt)
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md \
            "${files[@]}" dist/checksums.txt dist/checksums.txt.sigstore.json dist/provenance.sigstore.json
      # The docs deploy waits for the release, so `latest` and the root
      # installers never point at a version without assets. A pushed tag
      # already triggered docs.yaml.
      - name: Deploy the docs for this release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh workflow run docs.yaml --ref "$TAG"
