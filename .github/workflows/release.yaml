name: release

# Changesets drive the version: each PR adds a .changeset/*.md entry, and on
# main the version-pr job keeps a "chore: version packages" PR open that
# applies them (package.json version, CHANGELOG.md). After that PR merges, a
# maintainer tags the merge commit v<package.json version>; the tag runs the
# release job, which builds, signs and attests, verifies dist/ with
# tests/release, and only then creates the GitHub Release. A tag that does not
# match package.json fails verification and publishes nothing.
#
# Write scopes only on push to main or on a tag, never on pull_request; the
# PR-side dry-run is the ci-release job in ci.yaml.

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-pr:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      # changesets/action v2 input names (version-script, pr-title,
      # commit-message, github-token). Publishes nothing: no publish script.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ github.token }}
          version-script: npm run release:version
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # keyless signing (cosign) and provenance
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.42.3
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Build, checksum, SBOM and sign (nothing is published yet)
        run: |
          make goreleaser
          bin/goreleaser release --clean --skip=publish
      - name: SLSA provenance for every file in checksums.txt
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Add the provenance bundle to the release files
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" dist/provenance.sigstore.json
      - name: Verify the artifacts match what the release claims
        env:
          AVAL_RELEASE_DIST: ${{ github.workspace }}/dist
          AVAL_RELEASE_TAG: ${{ github.ref_name }}
        run: go test -count=1 -v ./tests/release/...
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v h="## ${TAG#v}" '$0 == h {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has no section for ${TAG#v}"; exit 1; }
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md \
            dist/*.tar.gz dist/*.zip dist/*.sbom.json \
            dist/checksums.txt dist/checksums.txt.sigstore.json dist/provenance.sigstore.json
