name: release

# Changesets drive the version: each PR adds a .changeset/*.md entry, and on
# main the version-pr job keeps a "chore: version packages" PR open that
# applies them (package.json version, CHANGELOG.md). A push made with
# GITHUB_TOKEN starts no workflow, so after changesets creates or rewrites that
# PR (branch changeset-release/main), the version-pr-ci job dispatches ci.yaml
# on it; the dispatch run is the PR's ci, and its `required` check reports on
# the PR's head commit. Once ci passes on the merge commit, auto-tag (on
# workflow_run of ci) tags it v<package.json version> and dispatches this
# workflow on the tag; the release job dispatches docs.yaml once the release
# exists. A tag created with GITHUB_TOKEN triggers no workflow, but a dispatch
# does, so the release job still runs on refs/tags/v<version> and signs with
# the release.yaml@refs/tags/<tag> identity tests/release requires. A maintainer
# can still push a tag by hand. The release job waits for e2e-gate (a verified
# e2e attestation for the commit, checked with the aval release ci.yaml pins),
# builds, signs and attests, verifies dist/ with tests/release, and only then
# creates the GitHub Release.
# A tag that does not match package.json fails verification and publishes
# nothing. After the release, pin-actions opens a PR (branch
# release-pins/main) that moves the GitHub actions' aval pins to it, and
# pin-actions-ci dispatches ci.yaml on that branch. Once that PR merges,
# pin-examples opens one more (branch release-pins/examples) that moves the
# examples' action pins to the merge commit, and pin-examples-ci dispatches
# ci.yaml on it.
#
# Write scopes only on push to main, on a tag, or on a successful ci run of a
# push to main (workflow_run runs this file from main and checks out only that
# main commit), never on pull_request; the PR-side dry-run is the ci-release
# job in ci.yaml.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  # auto-tag dispatches the release on the tag; a dispatch on a branch runs no job.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_run' && 'auto-tag' || github.ref }}
  cancel-in-progress: false

jobs:
  version-pr:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr-number: ${{ steps.changesets.outputs.pr-number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          # v5+ caches automatically from package.json; no cache in a job
          # that can write the repository (cache poisoning).
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      # changesets/action v2 input names (version-script, pr-title,
      # commit-message, github-token). Publishes nothing: no publish script.
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ github.token }}
          version-script: npm run release:version
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'

  # pr-number is set when changesets created or updated the version PR. Its
  # push used GITHUB_TOKEN and started no ci run; a dispatch does. A job of its
  # own, so actions: write never sits beside contents: write and the npm code
  # version-pr runs (that pair could tag and dispatch a release). No checkout:
  # GH_REPO names the repository.
  version-pr-ci:
    needs: version-pr
    if: needs.version-pr.outputs.pr-number != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Run ci on the version PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for _ in 1 2 3; do
            gh workflow run ci.yaml --ref changeset-release/main && exit 0
            sleep 15
          done
          exit 1

  # Tags the merge of the version PR (or the first green commit after it with
  # no pending changeset). Releases nothing unless the tag does not exist yet,
  # the version is newer than every v* tag, the commit is on main and no
  # changeset is pending. Runs no code from the checkout
  # (tests/architecture/release_workflow_test.go).
  auto-tag:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag
      actions: write # dispatch release.yaml on the tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Tag a merged version PR and dispatch the release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag="v$(jq -r .version package.json)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::bad version in package.json: $tag"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            if ! gh release view "$tag" > /dev/null 2>&1; then
              echo "::warning title=tag without release::$tag exists but has no GitHub Release; run: gh workflow run release.yaml --ref $tag"
            fi
            echo "$tag exists: nothing to release"; exit 0
          fi
          latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$tag" | sort -V | tail -1)" != "$tag" ]; then
            echo "$tag is older than $latest: not tagging"; exit 0
          fi
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "$SHA is no longer on main: not tagging"; exit 0
          fi
          pending=$(find .changeset -name '*.md' ! -name README.md 2> /dev/null || true)
          if [ -n "$pending" ]; then
            echo "::warning title=unreleased version::$tag is not tagged and changesets are pending; if the version PR is merged, tag it by hand: git tag $tag <version-merge-sha> && git push origin $tag"
            echo "$pending"; exit 0
          fi
          # A tag created with GITHUB_TOKEN triggers no workflow: dispatch it.
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$SHA" > /dev/null
          gh workflow run release.yaml --ref "$tag"
          echo "::notice title=release dispatched::tagged $SHA as $tag"

  # Dogfooding (#28): the tagged commit must carry a verified, passing
  # result of the heavy suite (aval-e2e in aval.yaml), signed by ci.yaml on
  # main at runner level, under main's .github/aval/policy.yaml (read from
  # origin/main, never from the checkout) and the registry inside it. The
  # verifier is the aval release integrations/github/run pins at this tag
  # (DESIRED_VERSION and its linux_amd64 sha256), installed by
  # scripts/get-aval.sh with --require-verify and --require-provenance:
  # dogfood-publish signed the result through integrations/github/publish,
  # which pins the same release (#216), and only the same release computes
  # the same fingerprint. A binary built from the tag could compute a newer
  # fingerprint manifest (aval-fingerprint/vN) and miss every time (#234). A
  # miss (exit 4) or any error stops the release; a verification failure
  # (exit 5) is a security event and stops it too. A job of its own with a
  # read-only token, so neither the installer nor aval runs beside the
  # release's write, signing and attestation scopes. GHCR is read
  # anonymously; no token reaches aval.
  e2e-gate:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # fetch-depth 0 fetches origin/main, where the policy is read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.0.6
      # A missing or malformed pin fails here (tests/architecture/release_gate_test.go).
      - name: Install the aval release the actions pin (verified)
        env:
          # gh attestation verify (--require-provenance) needs a token.
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^ *DESIRED_VERSION: *//p' integrations/github/run/action.yml)
          sha256=$(grep -o 'linux_amd64=[0-9a-f]\{64\}' integrations/github/run/action.yml)
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$sha256" =~ ^linux_amd64=[0-9a-f]{64}$ ]]; then
            echo "::error title=no release pin::integrations/github/run/action.yml must pin DESIRED_VERSION and a linux_amd64 sha256 once"
            exit 1
          fi
          cosign=$(command -v cosign)
          gh=$(command -v gh)
          git show origin/main:scripts/get-aval.sh > "$RUNNER_TEMP/get-aval.sh"
          PATH="/usr/bin:/bin:${cosign%/*}:${gh%/*}" AVAL_INSTALL_DIR="$RUNNER_TEMP/aval" USE_SUDO=false \
            /bin/bash "$RUNNER_TEMP/get-aval.sh" --version "$version" --sha256 "$sha256" --require-verify --require-provenance
          echo "$RUNNER_TEMP/aval" >> "$GITHUB_PATH"
      - name: Require a verified e2e attestation for this commit
        run: |
          git show origin/main:.github/aval/policy.yaml > "$RUNNER_TEMP/policy.yaml"
          code=0
          aval verify -f aval.yaml --test aval-e2e --policy "$RUNNER_TEMP/policy.yaml" --min-trust-level runner -o json > "$RUNNER_TEMP/e2e-verify.json" || code=$?
          if [ "$code" -eq 5 ]; then
            echo "::error title=aval SECURITY::an e2e attestation for this commit failed signature or policy verification; investigate before releasing"
            exit 1
          fi
          if [ "$code" -ne 0 ]; then
            echo "::error title=no verified e2e attestation::aval verify exited $code; wait for ci.yaml on main to publish the e2e result for this commit, then re-run"
            exit 1
          fi
          jq -e '.outcome == "verified" and .result == "passed"' "$RUNNER_TEMP/e2e-verify.json" > /dev/null \
            || { echo "::error title=e2e attestation is not a pass::the verified e2e result for this commit did not pass"; exit 1; }

  release:
    needs: e2e-gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      actions: write # dispatch docs.yaml on the tag once the release exists
      id-token: write # keyless signing (cosign) and provenance
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.42.3
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.0.6
      - name: Build, checksum, SBOM and sign (nothing is published yet)
        run: |
          make goreleaser
          bin/goreleaser release --clean --skip=publish
      - name: SLSA provenance for every file in checksums.txt
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Add the provenance bundle to the release files
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" dist/provenance.sigstore.json
      - name: Verify the artifacts match what the release claims
        env:
          AVAL_RELEASE_DIST: ${{ github.workspace }}/dist
          AVAL_RELEASE_TAG: ${{ github.ref_name }}
        # The pin checks download the pinned releases' checksums (aval's and
        # cosign's); ci-release and pin-actions run them, so a download error
        # cannot block a release.
        run: go test -count=1 -v -skip '^(TestActionPinsMatchReleaseChecksums|TestCosignPinMatchesRelease)$' ./tests/release/...
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v h="## ${TAG#v}" '$0 == h {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has no section for ${TAG#v}"; exit 1; }
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # Uploads only what tests/release verified: the files checksums.txt
        # lists, plus checksums.txt and its two bundles. No globs; the test
        # TestReleaseWorkflowVerifiesBeforePublishing pins this command.
        run: |
          mapfile -t files < <(awk '{print "dist/" $2}' dist/checksums.txt)
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md \
            "${files[@]}" dist/checksums.txt dist/checksums.txt.sigstore.json dist/provenance.sigstore.json
      # The docs deploy waits for the release, so `latest` and the root
      # installers never point at a version without assets. A pushed tag
      # already triggered docs.yaml.
      - name: Deploy the docs for this release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh workflow run docs.yaml --ref "$TAG"

  # After each release, a PR moves the aval pins of the GitHub actions
  # (integrations/github/{run,publish}/action.yml) to it, from the published
  # checksums.txt (#213), so pinning an action by commit SHA pins the binary
  # too. The branch release-pins/main is force-pushed from main; nothing is
  # pinned when main already pins this release or a newer one. tests/release
  # checks the result before the push (TestActionPinsMatchReleaseChecksums).
  # Only contents and pull-requests write: no signing, attestation or
  # dispatch scope.
  pin-actions:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # push release-pins/main
      pull-requests: write # open the pin PR
    outputs:
      pushed: ${{ steps.pr.outputs.pushed }}
    steps:
      # The write token stays out of .git/config and out of the step that
      # runs code from the checkout; only the push step gets it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Pin the actions to this release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pinned=$(sed -n 's/^ *DESIRED_VERSION: *//p' integrations/github/run/action.yml)
          if [ "$(printf '%s\n%s\n' "$pinned" "$TAG" | sort -V | tail -1)" != "$TAG" ]; then
            echo "main pins $pinned, newer than $TAG: nothing to pin"; exit 0
          fi
          curl -fsSL -o "$RUNNER_TEMP/checksums.txt" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/checksums.txt"
          scripts/pin-actions.sh "$TAG" "$RUNNER_TEMP/checksums.txt" \
            integrations/github/run/action.yml integrations/github/publish/action.yml
          go test -count=1 -run TestActionPinsMatchReleaseChecksums ./tests/release/
      - name: Open or update the pin PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if git diff --quiet; then echo "nothing to pin"; exit 0; fi
          title="chore: pin aval $TAG in the GitHub actions"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C release-pins/main
          git commit -qam "$title"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push --force origin release-pins/main
          body="Moves DESIRED_VERSION and AVAL_SHA256 of integrations/github/run and integrations/github/publish to $TAG, from its checksums.txt. Opened by the pin-actions job of release.yaml (#213)."
          if [ -n "$(gh pr list --head release-pins/main --state open --json number --jq '.[].number')" ]; then
            gh pr edit release-pins/main --title "$title" --body "$body"
          else
            gh pr create --base main --head release-pins/main --title "$title" --body "$body"
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"

  # The pin PR's push used GITHUB_TOKEN and started no ci run; a dispatch
  # does, as version-pr-ci does for the version PR.
  pin-actions-ci:
    needs: pin-actions
    if: needs.pin-actions.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Run ci on the pin PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for _ in 1 2 3; do
            gh workflow run ci.yaml --ref release-pins/main && exit 0
            sleep 15
          done
          exit 1

  # Once a pin PR merges, a PR (branch release-pins/examples) moves the
  # examples' uses of the GitHub actions (examples/*/.github/workflows) to
  # the main commit that pins the new release, with a "# <tag>" comment, so
  # the guides that embed them show the current release (#261). The pin PR
  # cannot carry this: its squash-merge commit does not exist before it
  # merges, and Dependabot would move them to the tag's commit, which still
  # pins the previous release. Runs on every push to main; nothing is pushed
  # when the examples already name main's DESIRED_VERSION. tests/architecture
  # (TestExampleActionPins) allows the examples one pin behind only.
  pin-examples:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push release-pins/examples
      pull-requests: write # open the examples' pin PR
    outputs:
      pushed: ${{ steps.pr.outputs.pushed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pin the examples to this commit
        run: |
          pinned=$(sed -n 's/^ *DESIRED_VERSION: *//p' integrations/github/run/action.yml)
          git ls-files -z 'examples/*/.github/workflows/*.yml' |
            xargs -0 scripts/pin-examples.sh "$GITHUB_SHA" "$pinned"
      - name: Open or update the examples' pin PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned=$(sed -n 's/^ *DESIRED_VERSION: *//p' integrations/github/run/action.yml)
          if git diff --quiet; then echo "the examples pin $pinned"; exit 0; fi
          title="chore: pin the examples to aval $pinned"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C release-pins/examples
          git commit -qam "$title"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push --force origin release-pins/examples
          body="Moves the examples' uses of integrations/github/run and integrations/github/publish to $GITHUB_SHA, the main commit that pins $pinned. Opened by the pin-examples job of release.yaml (#261)."
          if [ -n "$(gh pr list --head release-pins/examples --state open --json number --jq '.[].number')" ]; then
            gh pr edit release-pins/examples --title "$title" --body "$body"
          else
            gh pr create --base main --head release-pins/examples --title "$title" --body "$body"
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"

  # As pin-actions-ci, for the examples' pin PR.
  pin-examples-ci:
    needs: pin-examples
    if: needs.pin-examples.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Run ci on the examples' pin PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for _ in 1 2 3; do
            gh workflow run ci.yaml --ref release-pins/examples && exit 0
            sleep 15
          done
          exit 1
