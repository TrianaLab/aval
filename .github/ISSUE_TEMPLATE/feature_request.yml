name: Feature request
description: Suggest a feature or enhancement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - Contract (aval.yaml)
        - Fingerprint
        - Attestation and signing
        - Registry
        - Verification and policy
        - Documentation
        - Other
    validations:
      required: true
